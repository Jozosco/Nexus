dataset: geopolitical_indices
source_connector: src/pipeline/connectors/gpr_connector.py
output_path: data/raw/geopolitical_indices_YYYYMMDD.parquet
description: "Caldara & Iacoviello GPR Index · Perplexity 실시간 지정학 동향 (WBS 1.1.6)"
note: "GPR baseline ≈ 100; 임계값 ≥ 200 → P1-02 경보 (MEMORY P-002)"

columns:
  - name: price_date
    dtype: datetime64[ns]
    nullable: false
    description: "관측 기준일 (GPR: 월 첫날, Perplexity: 수집일)"

  - name: source_name
    dtype: object
    nullable: false
    description: "데이터 출처 (Caldara_Iacoviello | Perplexity/GPR)"

  - name: indicator_code
    dtype: object
    nullable: false
    description: "지표 코드 (GPR | GPR_REALTIME | GPR_QUALITATIVE)"

  - name: value
    dtype: float64
    nullable: false
    description: "GPR 지수 (baseline ≈ 100)"

  - name: unit
    dtype: object
    nullable: true
    description: "index (baseline≈100)"

  - name: note
    dtype: object
    nullable: true
    description: "프록시/정성 표시 ([PERPLEXITY-PROXY] | [QUALITATIVE:HIGH/MEDIUM/LOW])"

  - name: ingested_at
    dtype: datetime64[ns]
    nullable: false
    description: "수집 시각 (UTC)"

  # ── as-of 시점 정합성 5필드 (D-023 · src/pipeline/asof.py) ──────────────────
  # 규칙: 모델의 t일 입력 = available_at <= t 를 만족하는 가장 최근 값
  # 부여: attach_asof(df, source=...) — 커넥터가 직접 계산하지 않는다
  - name: event_time
    dtype: datetime64[ns]
    nullable: false
    description: "측정 대상 현상이 발생한 시점(관측일). price_date와 동일한 경우가 많음"

  - name: period_end
    dtype: datetime64[ns]
    nullable: true
    description: "집계 기간 종료일. 월간·연간 자료에만 존재(일별은 null)"

  - name: release_time
    dtype: datetime64[ns]
    nullable: true
    description: "원천이 실제로 공표한 시점"

  - name: available_at
    dtype: datetime64[ns]
    nullable: false
    description: "우리가 최초로 사용 가능했던 시점 — **모델 필터의 기준**. 없으면 모델 투입 금지"

  - name: source_vintage
    dtype: object
    nullable: true
    description: "개정본 식별자. 개정 소스는 덮어쓰지 않고 vintage별로 적재"
