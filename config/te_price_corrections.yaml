# Trading Economics 수동 업로드본 가격 정정 오버레이 (A-290 · 2026-09-28 승인자 지시)
# 원본 xlsx는 수정하지 않는다 — scripts/ingest_te_xlsx.py가 정형화 단계에서 이 목록을 덮어쓴다.
# 기준: 부르사 말레이시아 파생상품거래소 팜유 선물(FCPO) **3번째 월물(벤치마크) 정산가** — TE 팜유는
#       평소 이 값과 링깃 단위까지 일치함(8/3~8/27 대조). 불일치는 월물 교체 지연·만기 월물 혼입뿐.
