# 대두유·대체유 산지 좌표 — 단일 진실 원천 (2026-09-13 신설)
# 소비자: src/pipeline/connectors/climate_connector.py (Open-Meteo 아카이브·예보)
#         data/schemas/climate_data.yaml (region_code 열거)
#         docs/research_desk/2026-09/climate_regions_forecast_weathernext_2026_09_13.md
# 형식 제약: 파서 폴백(pyyaml 부재 시)을 위해 각 지역은 `- code:`로 시작하는 평면 매핑만 사용.
version: '1.0'
updated: 2026-09-13
source_note: >
  tier1 = 승인자 공유 정본 좌표 표(docs/research_desk/_reference/soybean_oil_production_climate.md §3.2)
  — NASA POWER 업로드본 좌표와 일치 확인(CONFIRMED).
  tier2 = 주(州) 중심 근사 좌표(INFERENCE) — 승인자 확인 대기. 확인 전에는 참고 수집 전용이며
  tier1과 동일 코드 규약으로 적재하되 모델 투입 전 좌표 확정이 선행 조건.
code_conventions:
  openmeteo_archive: "{var}_{CC}_{Region}   (예: precipitation_sum_BR_MatoGrosso)"
  openmeteo_forecast: "FCST_{var}_{CC}_{Region}   (예: FCST_precipitation_sum_BR_MatoGrosso)"
  nasa_power_upload: "{PARAM}_{Region}   (예: PRECTOTCORR_MatoGrosso — 업로드본 규약, 변경 없음)"
  region_code: "^[A-Z]{2}_[A-Za-z]+$  (ISO2 국가 접두 + 지역명, 공백·하이픈 없음)"
tiers:
  '1': "CONFIRMED — 정본 좌표 표와 일치. 아카이브 daily 8변수(토양 hourly 포함) + 예보"
  '2': "INFERENCE — 주 중심 근사. 아카이브 daily 6변수만(토양 hourly 생략) + 예보. 부하 상한용"

