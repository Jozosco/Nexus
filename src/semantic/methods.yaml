# src/semantic/methods.yaml — 예측 로직 선례 층 (시맨틱 레이어 ⑦ · v3.2)
# 목적: 우리가 쓰는 분석 기법(analysis_methods)과 그 근거가 된 외부 문헌(method_precedents)을
#       한 원장에 묶어, "어떤 논문이 어떤 기법의 무엇을 정당화하는가"를 기계 검증 가능하게 만든다.
# 원칙:
#   ① 문헌은 기법을 정당화할 뿐 대체하지 않는다 — 채용은 승격 게이트(c03 §4) 통과 후에만.
#   ② 모든 선례는 판정(verdict)을 명시한다. '배경'·'인용 주의'·'반면교사'도 정당한 판정이다.
#   ③ 근거 없는 등재 금지 — evidence(locator·quote_ko) 필수(S-5).
#   ④ 원문 파일은 docs/research_desk/references/ 에 실재해야 한다(C13이 디스크 대조).
# 게이트: scripts/validate_semantic_layer.py C13
# 관리: P1-06 (기법 정의 확정: C-03 · 문헌 판독: C-04 · 도메인 해석: P1-01~04)
schema_version: '3.2'
updated: 2026-09-09
source_of_truth:
  methods: .claude/rules/modeling.md · .claude/agents/c03-data-scientist.md §4~§5
  strategy: docs/research_desk/2026-08/model_strategy_2026_08_12/
  precedents: docs/research_desk/2026-08/forecasting_precedents_notes_2026_08_28.md
  references_dir: docs/research_desk/references/

# ── 통제 어휘 ────────────────────────────────────────────────────────────────
verdict_vocab: ['채용', 'Challenger 검토 대기', '배경', '인용 주의', '반면교사']
goal_vocab: ['G1', 'G2', 'G3', 'W0', '공통']            # analysis_methods.goal
precedent_goal_vocab: ['G1', 'G2', 'G3', 'W0', '배경']  # method_precedents.target_goal
role_vocab: ['champion', 'challenger', 'baseline', 'diagnostic', 'frozen']
family_vocab: ['statistical', 'ml', 'econometric', 'simulation', 'nonparametric']
precedent_status_vocab: ['등재', '반영 완료', '대기']

# ── 전 기법 공통 누수 규율 (개별 leakage_rules는 이 위에 얹는 추가 제약) ─────
common_leakage_rules:
  - 'as-of 시점 정합(D-023): 모델의 t일 입력은 available_at ≤ t 인 최근값만'
  - '전처리·스케일링·결측대치·변수선택·보정은 fold 내부에서 재적합(전 구간 일괄 적합 금지)'
  - '무작위 분할 금지 — walk-forward(expanding·sliding)만 사용(M-001)'
  - '전체 시계열 일괄 신호분해(VMD·EMD 계열) 기본 제외 — fold 내 one-sided 재적합일 때만 허용(M-010)'
  - '타깃 계열(target_ 접두사)은 피처 후보에서 일괄 제외'

# ══ ① analysis_methods — 우리 스택의 기법 원장 ════════════════════════════════
analysis_methods:

  - id: AM-01
    name: Elastic Net (stability selection)
    name_ko: 엘라스틱넷 안정성 선택
    family: statistical
    goal: G1
    role: champion
    library: scikit-learn (ElasticNetCV)
    contract: 공선성이 제어된 변수 집합 + 계수 부호 — horizon×레짐별로 산출
    leakage_rules:
      - '변수 선택 자체를 fold 내부에서 재적합(전체 표본 선택 후 fold 평가 금지)'
      - 'LASSO 단독 회귀는 폐기 — 동행 변수 중 하나만 남겨 중요도가 불안정(M-005)'
    status: 운영

  - id: AM-02
    name: LightGBM / XGBoost + SHAP
    name_ko: 그래디언트 부스팅 중요도와 SHAP 기여도
    family: ml
    goal: G1
    role: champion
    library: lightgbm · xgboost · shap
    contract: 변수 기여도 순위 — horizon(1·5·20·60일)×레짐×원산지별 분해
    leakage_rules:
      - 'SHAP 값은 기여도이지 인과가 아니다 — 인과 주장은 인과엣지 원장 경유(c03 §9)'
      - '무역 흐름 파생 피처는 log1p 변환 후 투입(스케일 혼재 완화)'
    status: 운영

  - id: AM-03
    name: Permutation importance
    name_ko: 순열 중요도
    family: ml
    goal: G1
    role: diagnostic
    library: scikit-learn
    contract: SHAP 순위의 교차검증용 독립 중요도 — 두 방법이 어긋나면 승격 보류
    leakage_rules:
      - '검증 fold에서만 산출 — 학습 fold 순열은 과적합 기여를 그대로 반영'
    status: 운영

  - id: AM-04
    name: Granger causality (Bonferroni-corrected)
    name_ko: 그레인저 인과 검정(본페로니 보정)
    family: econometric
    goal: G1
    role: diagnostic
    library: statsmodels
    contract: 선행·시차 후보와 p값 — 보정 전후를 구분 표기(미보정 유의는 참고 등급)
    leakage_rules:
      - '다중검정 보정 α/m 필수 — 후보 수가 클수록 우연 유의가 늘어난다'
      - '통계적 선행성은 인과가 아니다 — 도메인 메커니즘 없이 인과엣지로 승격 금지'
    status: 운영

  - id: AM-05
    name: Local Projections
    name_ko: 국소투영 충격반응
    family: econometric
    goal: G1
    role: diagnostic
    library: statsmodels
    contract: 시차별 반응 크기·지속기간 — 사건 임펄스의 지속 구간 서술 근거
    leakage_rules:
      - '충격 정의(사건 시점)는 available_at 기준 — 사후 확정 사건일 사용 금지'
    status: 운영

  - id: AM-06
    name: Analogue slice (Stage 1, univariate quantile)
    name_ko: 과거 유사국면 단변량 분위 슬라이스
    family: nonparametric
    goal: G1
    role: champion
    library: src/forecasting/analogue_g1.py (pandas·numpy)
    contract: 현재와 같은 분위였던 과거 거래일의 1주·1개월·3개월 실측 수익률 분포 — 전망 아님
    leakage_rules:
      - '유사일 탐색은 후방참조 z만 사용 · 전방 수익률은 mart의 유일한 전방참조 컬럼 재사용'
      - '직전 60거래일 이웃 제외(전방 창 겹침) · 에피소드 8건 미만이면 산출 보류'
      - '통계 검정 없음 — 기술 서술까지(다중검정 문제 원천 차단, A-191 서술 계약)'
    status: 운영

  - id: AM-07
    name: SARIMAX / Dynamic Regression
    name_ko: 외생변수 포함 계절 ARIMA
    family: econometric
    goal: G2
    role: champion
    library: statsmodels
    contract: horizon별 평균 경로 — 분위 결합의 중심 축
    leakage_rules:
      - '외생변수는 예측 시점에 실제로 알 수 있던 값만(available_at ≤ t)'
      - '차분·정상화 판정도 fold 내부에서 재적합'
    status: 설계 확정

  - id: AM-08
    name: Quantile LightGBM
    name_ko: 분위수 그래디언트 부스팅
    family: ml
    goal: G2
    role: champion
    library: lightgbm (objective=quantile)
    contract: P10/P25/P50/P75/P90 직접 예측 — 분위 교차 방지 후처리 포함
    leakage_rules:
      - '변동성 σ̂를 피처로 주입하는 경우 fold 내 재적합 산출분만 사용(전 구간 σ̂ 일괄 산출은 누수)'
    status: 설계 확정

  - id: AM-09
    name: EGARCH-X
    name_ko: 비대칭 조건부 변동성 모형
    family: econometric
    goal: G2
    role: champion
    library: arch (Python) · rugarch (R)
    contract: 조건부 변동성 σ̂_t와 꼬리 비대칭 — 분위 모형의 폭 근거
    leakage_rules:
      - '검증된 시장 충격(2020·2022)을 캡핑하면 꼬리를 학습하지 못한다 — IQR 캡은 데이터 오류에만'
    status: 설계 확정

  - id: AM-10
    name: EnCQR (Ensemble Conformalized Quantile Regression)
    name_ko: 앙상블 컨포멀 분위 보정
    family: statistical
    goal: G2
    role: champion
    library: mapie
    contract: 50/80/95% 구간의 분포 무가정 보정 + 레짐별 empirical coverage 보고
    leakage_rules:
      - '보정 집합은 학습 구간과 시간적으로 분리 — 보정에 미래 관측 사용 금지'
      - '뷰 결합 계층이 있는 경우 보정은 결합 이후 최종 단계에 둔다(커버리지 보장 유지)'
    status: 설계 확정

  - id: AM-11
    name: Markov Regime Switching / HMM
    name_ko: 마르코프 국면전환 모형
    family: econometric
    goal: G3
    role: champion
    library: statsmodels
    contract: Bear/Neutral/Bull 국면 **확률**(하드 라벨 아님) + 전환·지속기간
    leakage_rules:
      - '국면 라벨의 사후 평활(smoothed) 값을 실시간 신호로 쓰지 않는다 — filtered 확률 사용'
      - '국면 수 선택도 fold 내부 결정 — 전체 표본 BIC로 고정 금지'
    status: 설계 확정

  - id: AM-12
    name: Monte Carlo P&L simulation
    name_ko: 몬테카를로 손익 시뮬레이션
    family: simulation
    goal: G3
    role: champion
    library: numpy · scipy
    contract: 구매 시점·물량 대안별 per-MT regret 분포(P10/P50/P90) — 실제 P&L 아닌 market-cost proxy
    leakage_rules:
      - '내부 조달 실적을 입력에 넣지 않는다(D-021) — 외부 관측 기반 근사 손익만'
      - '난수 시드 고정·표본 수 기록 — 재현 불가한 밴드는 발행 금지'
    status: 구현 착수

  - id: AM-13
    name: Risk-averse procurement portfolio with Value of Information
    name_ko: 위험회피 조달 포트폴리오와 정보 가치
    family: simulation
    goal: G3
    role: champion
    library: pulp · scipy (설계 정본 — 구현 예정)
    contract: 선도·옵션·현물 3채널 배분 + CVaR 병기 + 신호 갱신의 정보 가치(VoI)
    leakage_rules:
      - '교란 신호는 발화 시점 기준으로만 판단 갱신에 투입 — 사후 확정 사건 소급 금지'
      - '원논문의 단일 공급자·수요 독립 가정은 다원산지 도메인으로 번역 후 사용'
    status: 설계 확정

  - id: AM-14
    name: Black-Litterman view-blending layer
    name_ko: 블랙-리터만 뷰 결합 계층
    family: statistical
    goal: 공통
    role: frozen
    library: numpy (설계 단계 — 구현 없음)
    contract: prior(채널 실적 비중·통계 분포)에 검증된 인과엣지 뷰를 신뢰도 가중 결합 + 뷰 기여 분해
    leakage_rules:
      - 'prior는 외부 공개 통계만(D-021) · 뷰의 1차 소스는 검증된 인과엣지(생성 문장 아님)'
      - '뷰 발화 시점은 available_at 기준 — look-ahead 차단이 설계 전제'
    status: 설계 동결(H0 — 마일스톤 무간섭)

  - id: AM-15
    name: Persistence (last value)
    name_ko: 최근값 이월 기준선
    family: statistical
    goal: 공통
    role: baseline
    library: pandas
    contract: 모든 목표의 최소 기준선 — 이를 못 이기면 승격 없음
    leakage_rules:
      - '무역 흐름 파생 계열에서는 특히 강한 기준선 — 명시 비교 없이 대안 채택 금지(c03 §5 특칙)'
    status: 운영

  - id: AM-16
    name: Seasonal naive
    name_ko: 계절 나이브 기준선
    family: statistical
    goal: 공통
    role: baseline
    library: statsmodels · pandas
    contract: 계절 주기 반복 예측 — 계절성 착시를 걸러내는 기준선
    leakage_rules:
      - '계절 주기 선택도 학습 구간 안에서 결정'
    status: 운영

  - id: AM-17
    name: ETS (exponential smoothing)
    name_ko: 지수평활 기준선
    family: statistical
    goal: 공통
    role: baseline
    library: statsmodels
    contract: 추세·계절 평활 기준선 — 점 예측 지표의 하한선
    leakage_rules:
      - '평활 계수는 fold 내부 추정'
    status: 운영

  - id: AM-18
    name: GRU / LSTM
    name_ko: 순환신경망 계열
    family: ml
    goal: G2
    role: challenger
    library: torch
    contract: horizon별 점·분위 예측 — 동일 fold에서 Champion과 비교
    leakage_rules:
      - '스케일러·윈도우 정규화를 전 구간에 적합하면 누수 — fold 내부에서만'
    status: 동결(GPU 표면 배정 전 — 미평가, 기각 아님)

  - id: AM-19
    name: N-BEATSx / N-HiTS
    name_ko: 계층적 분해 신경망 계열
    family: ml
    goal: G2
    role: challenger
    library: darts · neuralforecast
    contract: 다중 horizon 직접 예측 — 승격 게이트 통과 시에만 Champion 진입
    leakage_rules:
      - '내부 분해 블록은 학습 창 안에서만 작동해야 함(전 구간 사전분해 금지)'
    status: 동결(GPU 표면 배정 전 — 미평가)

  - id: AM-20
    name: Temporal Fusion Transformer
    name_ko: 시간 융합 트랜스포머
    family: ml
    goal: G2
    role: challenger
    library: pytorch-forecasting
    contract: 다중 horizon 분위 예측 + 변수 선택 게이트 — 해석 출력은 참고용
    leakage_rules:
      - 'known-future 공변량에 실제로는 사후에만 알 수 있는 값을 넣지 않는다'
    status: 동결(GPU 표면 배정 전 — 미평가)

  - id: AM-21
    name: PatchTST
    name_ko: 패치 기반 시계열 트랜스포머
    family: ml
    goal: G2
    role: challenger
    library: neuralforecast
    contract: 장기 horizon 점 예측 — 분위 계약 충족은 별도 래핑 필요
    leakage_rules:
      - '채널 독립 정규화도 fold 내부 통계로'
    status: 동결(GPU 표면 배정 전 — 미평가)

  - id: AM-22
    name: Chronos (pretrained time-series foundation model)
    name_ko: 사전학습 시계열 기반모형
    family: ml
    goal: G2
    role: challenger
    library: neuralforecast · torch
    contract: 제로샷·소량 미세조정 분위 예측 — 사전학습 코퍼스 오염 검증이 승격 전제
    leakage_rules:
      - '사전학습 구간이 우리 평가 구간과 겹칠 수 있음 — 오염 가능성을 실험 카드에 명시'
    status: 동결(GPU 표면 배정 전 — 미평가)

  - id: AM-23
    name: Wavelet Coherence + Surrogate Test
    name_ko: 웨이블릿 동조화와 대체 시계열 검정
    family: nonparametric
    goal: W0
    role: diagnostic
    library: PyWavelets
    contract: 유지류 간 동조화가 유의한 시간·주기 구간 표 — 기준 기간 판정의 각주 근거
    leakage_rules:
      - '사후 기술 분석 전용 — 예측 피처 파생 금지(전 구간 분해 누수 경로 차단)'
      - 'Surrogate 검정은 사전 등록 1회만 — 반복 탐색 금지'
    status: 승인 완료(W0 Stage 2 대기)

# ══ ② method_precedents — 외부 문헌 선례 원장 ═════════════════════════════════
method_precedents:

  - id: MP-01
    title: Temporal Edge Regression — UN 농산물 무역액 예측
    authors_year: Jiang·Zhang·Poursafaei·Huang (Cambridge·McGill·Mila), 2023
    ref: TGL_2023_temporal_edge_regression_UN_agriculture_trade.pdf
    method: 동적 그래프 엣지 회귀(TGN 계열) vs Persistence 기준선 비교
    target_goal: ['G1', 'G2']
    verdict: 채용
    applies_to: ['AM-15', 'AM-02']
    constraints:
      - '무역 흐름 도메인의 기준선 실증 — 예측 모델 자체를 이식한 것이 아님'
      - '그래프 계열은 기준선에 패배 — 도입 보류 근거로만 인용'
