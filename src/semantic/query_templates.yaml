# src/semantic/query_templates.yaml — 쿼리 템플릿 (시맨틱 레이어 ④)
# ERD 매핑(§8): QUERY_TEMPLATE — 보완 항목: 필수 슬롯(required_slots) · 출력 스키마(output_schema)
#   · 근거 반환 규칙(evidence_return)
# 목적: Perplexity/GDELT 검색을 고정 템플릿화 → ad-hoc 프롬프트 제거, 재현성 확보.
# 카테고리별 신뢰 도메인 서브셋(≤20)으로 Perplexity search_domain_filter 상한 회피.
# 관리: P1-05 · P1-06 · C-02
version: '2.0'
updated: 2026-08-11
erd_ref: .claude/agents/Semantic Layer & Ontology_ERD_v1.0.md §8

# ── 공통 계약 (모든 템플릿에 적용) ────────────────────────────────────────────
defaults:
  output_schema: p105_aspect_evaluation   # .claude/agents/p105-news-sentiment.md §3 JSON 스키마
  evidence_return:                        # ERD §13 - 모든 판단은 원문으로 역추적 가능해야 함
    require_evidence_snippet: true        # verbatim 발췌 필수 — 없으면 점수 폐기(환각 방어)
    require_source_url: true              # Perplexity citations / GDELT sourceurl
    require_publish_date: true            # 관측 시점 없는 신호는 저장 금지
    forbid_paraphrase_as_quote: true      # 요약문을 인용으로 표기 금지
  required_slots: [indicator, query, window_days]   # 슬롯 누락 시 실행 거부
  guardrails:
    - 관측(사실)과 전망(예측) 문장을 분리해 표기(ERD CQ-5)
    - 직접 가격 결론 금지 — Cause→Mechanism 체인으로만 서술(ontology.yaml dag_rule)
    - 내부 ERP·조달원가 정보 요청 금지(D-021)

templates:
  - indicator: ARG_EXPORT_TAX_SENTIMENT
    category: policy
    required_slots: {commodity: soybean oil, country: Argentina}
    query: "Argentina soybean oil export tax (retenciones) rate change last {window_days} days"
    domains: [reuters.com, bloomberg.com, bcr.com.ar, spglobal.com, agricensus.com]
    window_days: 30
  - indicator: INDIA_DUTY_SENTIMENT
    category: policy
    required_slots: {commodity: edible oil HS 1507, country: India}
    query: "India edible/soybean oil import duty change HS 1507 last {window_days} days"
    domains: [reuters.com, seaofindia.com, commerce.gov.in, agricensus.com]
    window_days: 60
  - indicator: BIODIESEL_POLICY_SENTIMENT
    category: policy
    required_slots: {policy_type: biofuel mandate, regions: [US, ID, MY, EU]}
    query: "Indonesia Malaysia B35 B40 biodiesel mandate; EU RED III; US RVO change"
    domains: [gapki.id, mpoc.org.my, ec.europa.eu, epa.gov, reuters.com, theicct.org]
    window_days: 60
  - indicator: US_CN_TARIFF_SENTIMENT
    category: geopolitical
    required_slots: {commodity: soybean, countries: [US, CN]}
    query: "US China soybean tariff escalation retaliatory duty last {window_days} days"
    domains: [reuters.com, bloomberg.com, customs.gov.cn, spglobal.com]
    window_days: 30
  - indicator: WASDE_CONSENSUS_SCORE
    category: supply
    required_slots: {report: WASDE, metric: ending stocks vs consensus}
    query: "USDA WASDE soybean oil ending stocks production vs consensus surprise"
    domains: [usda.gov, reuters.com, agricensus.com, igc.int]
    window_days: 30
    note: 발표일에만 실행(월 1회) — 일별 실행 금지(metrics.yaml aggregation 규칙)
  - indicator: BLACKSEA_RISK_SENTIMENT
    category: geopolitical
    required_slots: {region: Black Sea, commodity: sunflower oil}
    query: "Black Sea grain corridor Ukraine sunflower oil export disruption"
    domains: [reuters.com, apk-inform.com, spglobal.com, igc.int]
    window_days: 14
  - indicator: BRAZIL_CROP_SENTIMENT
    category: climate
    required_slots: {country: Brazil, crop: soybean}
    query: "Brazil soybean crop weather planting harvest CONAB forecast"
    domains: [conab.gov.br, abiove.org.br, reuters.com, usda.gov]
    window_days: 30
  - indicator: LOGISTICS_DISRUPTION_FLAG
    category: logistics
    required_slots: {chokepoints: [Hormuz, Panama, Suez], vessel_class: tanker}
    query: "Hormuz Panama Suez strait tanker transit disruption vegetable oil freight spike last {window_days} days"
    domains: [reuters.com, lloydslist.com, balticexchange.com, spglobal.com, tradewindsnews.com]
    window_days: 14
