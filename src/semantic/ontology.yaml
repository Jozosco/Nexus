# ── DAG 제약 (ERD §6 · S-1) ──────────────────────────────────────────────────
dag_constraints:
  rule: Cause → MarketMechanism → PriceOutcome 3단 강제 — Cause→Price 직접 엣지 금지
  node_classes: [CauseNode, MechanismNode, OutcomeNode]
  acyclic: true                    # validate_semantic_layer.py가 전역 순환 검사
  min_mechanism_nodes: 1           # 엣지마다 메커니즘 노드 최소 1개
  edge_lifecycle: [candidate, validated, rejected]   # 주의(A-164/H4): event_schema review_status는 [extracted, validated, rejected] — candidate≠extracted, 어휘 통일은 잔여 갭
  promotion_rule: candidate → validated 승격은 도메인 검증(P1-01~04) 서명 + evidence 첨부 필수(S-1).
    validated 엣지만 지식그래프·G1 인과 서술에 투영. rejected는 삭제하지 않고 보존(S-5).
  forbidden_relations:
  - DIRECT_CAUSE_TO_PRICE (외생 원인 → 가격 직접 연결)
  - 미검증(candidate) 엣지의 자동 승인·그래프 투영 (S-1)

# ── 방향 어휘 변환 규칙 (감사 갭 8 — 3계통 통일) ─────────────────────────────
direction_vocab:
  edge_direction: [UP, DOWN, CONTEXT]        # 인과엣지·event_schema causal_claim 공통
  chain_legend:                              # causal_chains.md 열람용 표기 ↔ 엣지 방향
    '📈 상승': UP
    '📉 하락': DOWN
  entity_price_direction_to_edge:            # entities.yaml price_direction(8값) → 엣지 3값
    UP: UP
    DOWN: DOWN
    UP_RISK: UP                              # 위험 발생 시 상방 — 엣지 방향은 UP
    DOWN_RISK: DOWN
    UP_IF_DOWN: CONTEXT                      # 조건부 — 트리거 방향과 결합해 UP/DOWN 판정
    DOWN_IF_UP: CONTEXT
    FLAT: CONTEXT
    CONTEXT: CONTEXT

# ── 엔티티 유형 (entities.yaml class 값의 단일 기준 — 계보별 그룹) ────────────
entity_types:
  registry_source: src/semantic/entities.yaml   # 용어별 class 부여는 사전이 담당
  families:
  - family: market_dag
    label_ko: 인과 DAG 노드·구성물
    classes: [CauseNode, MechanismNode, OutcomeNode, MarketMechanism, CausalClaim, CausalEdge]
  - family: commodity
    label_ko: 품목·품목분류
    classes: [Commodity, CommodityClass, CommodityCode, CommodityForm, CommodityRole,
              EnergyCommodity]
  - family: economy_fx
    label_ko: 거시경제·환율·위험
    classes: [EconomicIndicator, EconomicCondition, ExchangeRate, RiskIndicator]
  - family: agriculture_climate
    label_ko: 농업·작황·기상
    classes: [AgriculturalEvent, AgriculturalMetric, ClimateIndicator, ClimatePattern,
              CropStage, WeatherEvent, SupplyMetric, SupplyDemandIndicator, StockMetric,
              ProcessingMetric, ForecastMetric, ForecastSignal]
  - family: trade_policy
    label_ko: 무역·정책·규제
    classes: [TradeMetric, TradeRegion, TradeTerm, Policy, PolicyDocument, PolicyEvent,
              PolicyInstrument, PolicyLevel, PolicyMetric, BiofuelPolicy, Regulation]
  - family: geopolitics_logistics
    label_ko: 지정학·물류·해운
    classes: [GeopoliticalEvent, LogisticsEvent, LogisticsIndicator, LogisticsMetric,
              LeadTimeMetric, Chokepoint, Port, PortRegion, LaborEvent, InsuranceMetric,
              TradingHouse, Route]          # v3.1 — supply_chain 계층(회사·항로)
  - family: market_price_decision
    label_ko: 시장·가격·의사결정·분석
    classes: [PriceMetric, SpreadIndicator, MarketRegime, DecisionSignal, ModelFeature,
              SentimentMetric, ConfidenceMetric, EventType, TimePeriod, TemporalAttribute,
              Aspect, AnalysisMethod, AnalyticalConcept]
  - family: data_semantic_quality
    label_ko: 데이터·시맨틱·품질
    classes: [BoundingBox, BusinessRule, CanonicalEntity, DataSource, DeduplicationGroup,
              DesignPrinciple, DocumentChunk, EntityAlias, EntityMention, Evaluation,
              EvidenceSpan, ExtractionCapability, GovernanceRule, GroundTruth,
              KnowledgeGraph, Ontology, PageReference, ProvenanceRecord, QualityAlert,
              QualityMetric, ReviewProcess, Schema, SemanticLayer, SemanticStandard,
              SerializationFormat, SourceDocument]

# ── 관계 유형 58종 (v2 23종 + entities.yaml 실사용 35종 정식 등록) ────────────
relation_types:
# — 식별·정규화 —
- code: MENTION_OF
  definition: 언급이 표준 엔터티를 지칭
  domain: EntityMention
  range: CanonicalEntity
  symmetric: false
  constraints_example: SBO mention MENTION_OF Soybean Oil
- code: ALIAS_OF
  definition: 별칭이 표준 엔터티에 속함
  domain: EntityAlias
  range: CanonicalEntity
  symmetric: false
  constraints_example: 대두유 ALIAS_OF Soybean Oil
- code: CLASSIFIED_AS
  definition: 엔터티가 분류에 속함
  domain: CanonicalEntity
  range: TaxonomyCategory
  symmetric: false
  constraints_example: Soybean Oil CLASSIFIED_AS Vegetable Oil
- code: CLASSIFIES
  definition: 분류 체계·코드가 대상을 분류 (CLASSIFIED_AS 역방향)
  domain: Taxonomy/Code
  range: Entity
  symmetric: false
  constraints_example: HS 1507 CLASSIFIES Soybean Oil
- code: IDENTIFIES
  definition: 코드·키가 대상을 유일하게 식별
  domain: Code/Key
  range: Entity/Record
  symmetric: false
  constraints_example: document_id IDENTIFIES SourceDocument
- code: GROUPS
  definition: 그룹이 원소를 묶음
  domain: Group
  range: Member
  symmetric: false
  constraints_example: DeduplicationGroup GROUPS duplicate mentions
- code: IS_FORM_OF
  definition: 품목이 상위 품목의 가공 형태임
  domain: CommodityForm
  range: Commodity
  symmetric: false
  constraints_example: Crude Soybean Oil IS_FORM_OF Soybean Oil
- code: IS_LEVEL_OF
  definition: 값·등급이 척도의 수준임
  domain: Value/Grade
  range: Scale
  symmetric: false
  constraints_example: B40 IS_LEVEL_OF Biodiesel Blend Mandate
- code: PART_OF
  definition: 부분이 전체에 속함
  domain: Component
  range: Whole
  symmetric: false
  constraints_example: Rosario PART_OF Argentina export corridor
- code: COMPOSED_OF
  definition: 전체가 부분으로 구성됨 (PART_OF 역방향)
  domain: Whole
  range: Component
  symmetric: false
  constraints_example: Semantic Layer COMPOSED_OF entities/metrics/ontology
# — 근거·출처·검증 —
- code: SUPPORTED_BY
  definition: 주장·관계가 근거로 지지됨
  domain: Claim/Edge
  range: EvidenceSpan
  symmetric: false
  constraints_example: CausalClaim SUPPORTED_BY p.8 quote
- code: SUPPORTS
  definition: 근거·데이터가 판단을 지지함 (SUPPORTED_BY 역방향)
  domain: Evidence/Data
  range: Claim
  symmetric: false
  constraints_example: EvidenceSpan SUPPORTS CausalClaim
- code: DERIVED_FROM
  definition: 레코드가 원천에서 파생됨
  domain: Record
  range: SourceDocument/Chunk
  symmetric: false
  constraints_example: Observation DERIVED_FROM WASDE
- code: VALIDATED_BY
  definition: 레코드가 검토·평가로 검증됨
  domain: Record/Edge
  range: Review/Eval
  symmetric: false
  constraints_example: CausalEdge VALIDATED_BY P1-03
- code: VALIDATES
  definition: 절차·에이전트가 대상을 검증함 (VALIDATED_BY 역방향)
  domain: Process/Agent
  range: Record/Edge
  symmetric: false
  constraints_example: C-08 DQSOps VALIDATES sentiment bounds
- code: CONTRADICTS
  definition: 주장들이 서로 상충
  domain: Claim
  range: Claim
  symmetric: true
  constraints_example: Forecast A CONTRADICTS Forecast B
- code: CONFORMS_TO
  definition: 레코드가 스키마·표준을 준수함
  domain: Record
  range: Schema/Standard
  symmetric: false
  constraints_example: Event JSON CONFORMS_TO event_schema.json
- code: PROVIDES
  definition: 출처·기관이 데이터·서비스를 제공
  domain: Source/Actor
  range: Data/Service
  symmetric: false
  constraints_example: USDA PROVIDES WASDE report
- code: GENERATES
  definition: 프로세스가 산출물을 생성
  domain: Process
  range: Artifact
  symmetric: false
  constraints_example: summarize_pdfs.py GENERATES corpus index
- code: SERIALIZES
  definition: 형식이 데이터를 직렬화
  domain: Format
  range: Record
  symmetric: false
  constraints_example: JSON-LD SERIALIZES provenance export
- code: NORMALIZES
  definition: 절차가 표기·단위를 정규화
  domain: Process
  range: Term/Unit
  symmetric: false
  constraints_example: P1-06 NORMALIZES multilingual synonyms
- code: STANDARDIZES
  definition: 표준이 대상을 표준화
  domain: Standard
  range: Entity/Unit
  symmetric: false
  constraints_example: QUDT STANDARDIZES unit codes
- code: INSTANTIATES
  definition: 인스턴스가 클래스·온톨로지를 실체화
  domain: Instance/KG
  range: Ontology/Class
  symmetric: false
  constraints_example: Knowledge Graph INSTANTIATES Ontology
- code: DETECTS
  definition: 시스템·지표가 현상을 탐지
  domain: Detector/Indicator
  range: Event/Anomaly
  symmetric: false
  constraints_example: AIS anomaly monitor DETECTS route diversion
- code: DETECTED_BY
  definition: 현상이 시스템·지표로 탐지됨 (DETECTS 역방향)
  domain: Event/Anomaly
  range: Detector/Indicator
  symmetric: false
  constraints_example: Structural Break DETECTED_BY z-score threshold
- code: RECOMMENDS
  definition: 신호·에이전트가 행동을 권고 (HITL — 권고만, 자동 실행 금지)
  domain: Signal/Agent
  range: Action
  symmetric: false
  constraints_example: G3 regime signal RECOMMENDS Hold (human gate)
# — 측정·예측 —
- code: MEASURED_BY
  definition: 개념·현상이 지표로 측정
  domain: Entity/Condition
  range: Indicator
  symmetric: false
  constraints_example: ENSO MEASURED_BY ONI
- code: FORECASTS
  definition: 전망이 대상 지표를 예측
  domain: Forecast
  range: Metric
  symmetric: false
  constraints_example: WASDE Forecast FORECASTS Production
- code: RESPONDS_TO
  definition: 지표·주체가 자극에 반응
  domain: Metric/Actor
  range: Event/Signal
  symmetric: false
  constraints_example: Freight Rate RESPONDS_TO chokepoint crisis
# — 인과 DAG (Cause → Mechanism → Outcome) —
- code: CAUSES_MECHANISM
  definition: 원인이 시장 메커니즘을 촉발
  domain: CauseNode
  range: MechanismNode
  symmetric: false
  constraints_example: La Niña CAUSES_MECHANISM Yield Deficit
- code: MECHANISM_AFFECTS_OUTCOME
  definition: 메커니즘이 수급·가격 결과에 영향
  domain: MechanismNode
  range: OutcomeNode
  symmetric: false
  constraints_example: Yield Deficit MECHANISM_AFFECTS_OUTCOME SBO Price
- code: PROPAGATES_TO
  definition: 충격·위험이 다음 메커니즘·영역으로 전파 (메커니즘 체인 내부 연결)
  domain: MechanismNode/Shock
  range: MechanismNode/Domain
  symmetric: false
  constraints_example: Freight Spike PROPAGATES_TO CIF Cost
- code: RESULTS_IN
  definition: 사건·조치가 결과 상태를 낳음 (인과 축약 — 신규 인과엣지는 3단 체인 사용)
  domain: Event/Action
  range: Outcome/State
  symmetric: false
  constraints_example: Export Ban RESULTS_IN supply shortfall
- code: AFFECTS
  definition: 한 엔터티가 다른 대상에 영향
  domain: Entity/Event
  range: Entity/Metric
  symmetric: false
  constraints_example: Port Strike AFFECTS Lead Time
- code: INCREASES
  definition: 대상 값을 증가시킴
  domain: Entity/Event
  range: Metric
  symmetric: false
  constraints_example: Freight Shock INCREASES CFR Price
- code: DECREASES
  definition: 대상 값을 감소시킴
  domain: Entity/Event
  range: Metric
  symmetric: false
  constraints_example: Bumper Crop DECREASES Price
- code: CHANGES
  definition: 사건·정책이 대상 상태를 변경 (증감 미확정)
  domain: Event/Policy
  range: State/Metric
  symmetric: false
  constraints_example: Policy Pivot CHANGES trade flow pattern
# — 생산·교역·물류 —
- code: PRODUCES
  definition: 원료·공정이 산출물을 생산
  domain: Commodity/Process
  range: Commodity
  symmetric: false
  constraints_example: Soybean Crush PRODUCES Soybean Oil
- code: USED_AS
  definition: 품목이 특정 용도로 사용됨
  domain: Commodity
  range: Role
  symmetric: false
  constraints_example: Soybean Oil USED_AS Biodiesel Feedstock
- code: SUBSTITUTES_FOR
  definition: 품목이 다른 품목을 대체
  domain: Commodity
  range: Commodity
  symmetric: true
  constraints_example: Palm Oil SUBSTITUTES_FOR Soybean Oil
- code: EXPORTS_TO
  definition: 국가·주체가 목적지로 수출
  domain: Country/Actor
  range: Country/Market
  symmetric: false
  constraints_example: Brazil EXPORTS_TO Korea
- code: IMPORTS_FROM
  definition: 국가·주체가 원산지에서 수입
  domain: Country/Actor
  range: Country/Market
  symmetric: false
  constraints_example: Korea IMPORTS_FROM Argentina
- code: ROUTED_VIA
  definition: 교역·운송이 경로·항만을 경유
  domain: TradeFlow/Shipment
  range: Route/Port
  symmetric: false
  constraints_example: TradeFlow ROUTED_VIA Santos
- code: CONNECTS
  definition: 경로·해협이 지역·시장을 연결
  domain: Route/Chokepoint
  range: GeoEntity
  symmetric: false
  constraints_example: Panama Canal CONNECTS Atlantic-Pacific
- code: OPERATED_BY
  definition: 시설(항만·압착 플랜트·터미널)이 운영 주체에 의해 운영됨 (v3.1 — supply_chain)
  domain: Port/Facility
  range: TradingHouse/Actor
  symmetric: false
  constraints_example: Rosario crushing hub OPERATED_BY Bunge
- code: TRANSITS
  definition: 항로가 해협·운하를 경유함 (v3.1 — supply_chain 루트 → 교란 전파 연결)
  domain: Route
  range: Chokepoint
  symmetric: false
  constraints_example: US Gulf-Korea route TRANSITS Panama Canal
- code: LOCATED_AT
  definition: 엔터티가 위치에 존재
  domain: Entity
  range: GeoEntity
  symmetric: false
  constraints_example: Rosario crushing hub LOCATED_AT Argentina
- code: ORIGIN_OF
  definition: 지역이 물동량·상품의 원산지임
  domain: GeoEntity
  range: Commodity/TradeFlow
  symmetric: false
  constraints_example: US Gulf ORIGIN_OF SBO export cargo
- code: OCCURS_IN
  definition: 사건이 지리에서 발생
  domain: Event
  range: GeoEntity
  symmetric: false
  constraints_example: Drought OCCURS_IN Córdoba
- code: OCCURS_DURING
  definition: 사건이 기간·계절 중 발생
  domain: Event
  range: Period/Season
  symmetric: false
  constraints_example: Pollination Window OCCURS_DURING Jan-Feb
# — 정책·규제·거버넌스 —
- code: REGULATES
  definition: 정책이 품목·행위·시장을 규제
  domain: Policy
  range: Commodity/TradeFlow
  symmetric: false
  constraints_example: Export Tax REGULATES SBO Export
- code: GOVERNS
  definition: 규정·기관이 대상 절차·영역을 관할
  domain: Policy/Institution
  range: Entity/Process
  symmetric: false
  constraints_example: D-021 GOVERNS data scope
- code: RESTRICTS
  definition: 정책이 행위·물량을 제한
  domain: Policy
  range: TradeFlow/Activity
  symmetric: false
  constraints_example: EUDR RESTRICTS palm oil market access
- code: EXEMPTS
  definition: 정책이 대상을 예외 처리
  domain: Policy
  range: Entity/TradeFlow
  symmetric: false
  constraints_example: Agricultural Exemption EXEMPTS soybean tariff
- code: ESTABLISHES
  definition: 법령·기관이 제도·기준을 설립
  domain: Policy/Actor
  range: Institution/Rule
  symmetric: false
  constraints_example: Decree ESTABLISHES new export quota regime
- code: APPLIES_TO
  definition: 규칙·단위·조건이 대상에 적용됨
  domain: Rule/Term
  range: Entity
  symmetric: false
  constraints_example: T+2 FX Settlement APPLIES_TO import invoice
- code: VALID_FROM
  definition: 효력이 특정 시점부터 개시됨
  domain: Policy/Record
  range: Date
  symmetric: false
  constraints_example: Tariff cut VALID_FROM effective date
- code: VALID_DURING
  definition: 사실·효력이 특정 기간 동안 유효함
  domain: Fact/Policy
  range: Period
  symmetric: false
  constraints_example: Marketing Year price VALID_DURING Oct-Sep
# — 한국 영향 —
- code: HAS_KOREA_IMPACT
  definition: 사건·전망이 한국 영향 평가를 가짐
  domain: Event/Forecast
  range: KoreaImpact
  symmetric: false
  constraints_example: Route Disruption HAS_KOREA_IMPACT CIF Up
# — 금지 관계 —
- code: DIRECT_CAUSE_TO_PRICE
  definition: '금지 관계: 외생 원인에서 가격으로 직접 연결'
  domain: CauseNode
  range: PriceOutcome
  symmetric: false
  constraints_example: 금지 — 반드시 Market Mechanism 경유

