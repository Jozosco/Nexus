signal_tag_mapping:
  note: 한글 신호 태그(코퍼스 스크립트) ↔ UNSTR_* 시계열 ↔ P1-05 aspect 지표의 단일 기준.
    스크립트·에이전트는 이 표를 준수하며 새 태그 추가 시 이 표를 먼저 갱신한다.
  known_discrepancy: scripts/ingest_gain_pdf.py는 태그 7종(물류충격 누락)·정규식 상이 —
    summarize_pdfs.py 8종 기준으로 정렬 필요 (잔여 갭 · 스크립트 수정은 본 개정 범위 외)
