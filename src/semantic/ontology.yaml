# 필드 → 관계 코드 매핑: operated_by → OPERATED_BY(시설→운영주체) · transits → TRANSITS(항로→해협) ·
#   origin/destination → CONNECTS(항로→지리) · disruption_edges → causal_edges 원장 참조
# 근거: docs/research_desk/2026-08/competitive_differentiation_2026_08_14.md §3a·§3b
supply_chain:
  note: 교란 사건(호르무즈·수에즈·파나마 등)이 chokepoint → route → KR_IMPORT_CIF로
    전파되는 구조의 참조 데이터. 리드타임·운영 주체는 공개 자료 기반 초기값 —
    관세청 월별 도착 실측 역산으로 갱신 예정(성약~도착 전체 주기 포함).
  companies:                       # class TradingHouse — entities.yaml TERM 미등재(P1-06 등재 대기)
  - company_id: SC-ADM
    name: ADM (Archer Daniels Midland)
    class: TradingHouse
    pending_entity_registration: true
    footprint_note: 미국 중서부 압착 벨트 + 걸프 수출 체계. Spiritwood·Quincy 압착·정제 증설 (§3a)
  - company_id: SC-BUNGE
    name: Bunge
    class: TradingHouse
    pending_entity_registration: true
    footprint_note: 로사리오 권역 단독 일 18,000톤 압착 — 미주 최대 허브의 핵심 운영사 (§3a)
  - company_id: SC-CARGILL
    name: Cargill
    class: TradingHouse
    pending_entity_registration: true
    footprint_note: 미국·브라질·아르헨티나 압착·수출 체계 전반 (§3a)
  - company_id: SC-LDC
    name: LDC (Louis Dreyfus Company)
    class: TradingHouse
    pending_entity_registration: true
    footprint_note: 아르헨티나 Bahía Blanca 심수항 압착 증설 (§3a)
  - company_id: SC-COFCO
    name: COFCO International
    class: TradingHouse
    pending_entity_registration: true
    footprint_note: 장자강 East Ocean Oils & Grains — 아시아 최대급 통합 압착·정제 단지 (§3a)
  - company_id: SC-WILMAR
    name: Wilmar International
    class: TradingHouse
    pending_entity_registration: true
    footprint_note: 중국·인도·베트남·말레이시아 압착 + 세계 최대급 정제·유통망 — 아시아 RBD 공급 채널 (§3a)
  ports:
  - port_id: PORT-USG
    entity_term: TERM-100          # US Gulf (PortRegion) — entities.yaml 등재분 참조
    role: export
    operated_by: [SC-ADM, SC-BUNGE, SC-CARGILL, SC-LDC]   # 대표 운영 주체 — 비완전 목록
  - port_id: PORT-SANTOS
    entity_term: TERM-101          # Santos/Paranaguá (Port)
    role: export
    operated_by: [SC-BUNGE, SC-CARGILL, SC-LDC, SC-COFCO]
  - port_id: PORT-ROSARIO
    entity_term: TERM-102          # Rosario (PortRegion) — Up River FOB 기준점
    role: export
    operated_by: [SC-BUNGE, SC-CARGILL, SC-LDC, SC-COFCO]
  - port_id: PORT-PYEONGTAEK
    name: Pyeongtaek (평택항)
    class: Port
    role: import_discharge
    pending_entity_registration: true   # entities.yaml TERM 미등재 — P1-06 등재 대기
  - port_id: PORT-INCHEON
    name: Incheon (인천항)
    class: Port
    role: import_discharge
    pending_entity_registration: true
  waypoints:                       # 해협·운하 — TRANSITS 대상
  - way_id: WP-PANAMA
    entity_term: TERM-083          # Panama Canal (Chokepoint)
  - way_id: WP-HORMUZ
    entity_term: TERM-081          # Strait of Hormuz (Chokepoint) — 한국향 SBO 직항로 아님(운임 시장 전파)
  - way_id: WP-MALACCA
    name: Strait of Malacca (말라카 해협)
    class: Chokepoint
    pending_entity_registration: true
  - way_id: WP-SUEZ
    name: Suez Canal (수에즈 운하)
    class: Chokepoint
    pending_entity_registration: true
  routes:
  # 리드타임 출처: .claude/skills/phase1/04_supply_chain_analyst.md:115-121 (Avg CFR Lead Days)
  # ⚠️ 리드타임은 관세청 실측(월별 도착) 역산으로 갱신 예정 — 아래 값은 공개 문서 초기값
  - route_id: RT-USG-KR
    label_ko: 미국 걸프 → 한국 (조대두유 탱커)
    origin: PORT-USG
    destination: [PORT-PYEONGTAEK, PORT-INCHEON]
    lead_time_days: {min: 45, max: 50}
    lead_time_source: '.claude/skills/phase1/04_supply_chain_analyst.md:115-121'
    transits: [WP-PANAMA]
    disruption_edges: []           # 파나마 단독 인과엣지 미등재 — 후보 등재는 P1-04 검증 대기
  - route_id: RT-SANTOS-KR
    label_ko: 브라질 산투스·파라나과 → 한국
    origin: PORT-SANTOS
    destination: [PORT-PYEONGTAEK, PORT-INCHEON]
    lead_time_days: {min: 40, max: 45}
    lead_time_source: '.claude/skills/phase1/04_supply_chain_analyst.md:115-121'
    transits: [WP-MALACCA]         # 희망봉 → 인도양 → 말라카 경유 접근
    disruption_edges: [CE-010]
  - route_id: RT-ROSARIO-KR
    label_ko: 아르헨티나 로사리오 → 한국
    origin: PORT-ROSARIO
    destination: [PORT-PYEONGTAEK, PORT-INCHEON]
    lead_time_days: {min: 40, max: 45}
    lead_time_source: '.claude/skills/phase1/04_supply_chain_analyst.md:115-121'
    transits: [WP-MALACCA]
    disruption_edges: [CE-010]
  market_wide_freight_note: 호르무즈(WP-HORMUZ)·수에즈(WP-SUEZ)는 한국향 3개 루트의 직접
    경유지가 아니나 탱커 선복·AWRP(전쟁위험보험료)를 통해 운임 시장 전체로 전파된다
    (CE-010 · CE-013). 관측 지표는 BDI·BCAA z-score.

