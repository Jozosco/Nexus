# Run Historical Pipeline (트리거 파일 방식) — A-146
#
# 왜 필요한가: 저장소에 연결된 통합(integration) 토큰에 `actions: write` 권한이 없어
#   workflow_dispatch API 호출이 403으로 거부된다. 반면 **워크플로우 안의 GITHUB_TOKEN**은
#   `permissions: actions: write`를 선언하면 dispatch가 허용된다
#   (GitHub 재귀 방지 규칙의 명시적 예외: workflow_dispatch·repository_dispatch).
#   그래서 "트리거 파일 커밋 → 이 워크플로우가 본 파이프라인을 dispatch" 2단 구조를 쓴다.
#
# 사용법: `.github/triggers/run-historical.txt` 를 아무 내용으로든 수정·커밋하면 실행된다.
#   실행 파라미터는 그 파일 안에 `key=value` 형식으로 적는다(없으면 아래 기본값).
#     connector=all
#     include_api=true
#     start_year=2010
#     end_year=2026
#     skip_analysis=false
#
# 안전장치: 본 파이프라인(historical_backfill.yml)은 **한 글자도 수정하지 않는다**.
#   트리거 경로가 데이터 산출 경로와 겹치지 않으므로 파이프라인의 main 커밋이
#   이 워크플로우를 다시 부르는 루프는 발생하지 않는다.
name: Run Historical Pipeline (트리거 파일 방식)

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/run-historical.txt"
  workflow_dispatch: {}

permissions:
  actions: write        # dispatch 호출에 필요 — 이것이 403 우회의 핵심
  contents: read

concurrency:
  group: run-historical-launcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # A-157 가드가 HEAD~1 대조에 필요
          sparse-checkout: .github/triggers
          sparse-checkout-cone-mode: false
      # A-157: 트리거 파일이 실제로 바뀐 push에서만 발사 — 런처 자신·타 파일 변경으로
      #   옛 파라미터가 재발사되는 사고 차단(전환 커밋 포함).
      - name: Guard — trigger file actually changed?
        id: guard
        run: |
          git fetch --depth=2 origin main -q || true
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "^.github/triggers/run-historical.txt$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[정보] 트리거 파일 무변경 push — 발사 생략 (A-157)"
          fi
      - name: Read trigger parameters
        id: p
        if: steps.guard.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          F=".github/triggers/run-historical.txt"
          get() {  # key, default — 주석(#)·공백 무시
            v=$(grep -E "^\s*$1\s*=" "$F" 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '[:space:]')
            echo "${v:-$2}"
          }
          {
            echo "connector=$(get connector all)"
            echo "include_api=$(get include_api true)"
            echo "start_year=$(get start_year 2010)"
            echo "end_year=$(get end_year 2026)"
            echo "skip_analysis=$(get skip_analysis false)"
          } >> "$GITHUB_OUTPUT"
      - name: Dispatch Historical Analysis Pipeline
        if: steps.guard.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A-154: connector가 쉼표 구분 목록(예: databento,economic,climate)이면
          #        각 커넥터마다 gh workflow run을 반복 호출한다(항목별 공백 제거).
          #        단일 값이면 기존과 동일하게 1회 dispatch.
          CONNECTORS="${{ steps.p.outputs.connector }}"
          IFS=',' read -ra CONNECTOR_LIST <<< "$CONNECTORS"
          for C in "${CONNECTOR_LIST[@]}"; do
            C="$(echo "$C" | tr -d '[:space:]')"
            [ -z "$C" ] && continue
            echo "[실행] connector=$C · include_api=${{ steps.p.outputs.include_api }} · ${{ steps.p.outputs.start_year }}~${{ steps.p.outputs.end_year }}"
            gh workflow run historical_backfill.yml \
              --repo "${{ github.repository }}" --ref main \
              -f connector="$C" \
              -f include_api="${{ steps.p.outputs.include_api }}" \
              -f start_year="${{ steps.p.outputs.start_year }}" \
              -f end_year="${{ steps.p.outputs.end_year }}" \
              -f skip_analysis="${{ steps.p.outputs.skip_analysis }}"
            echo "- connector=\`$C\` 실행 요청 완료" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "### Historical Analysis Pipeline 실행 요청 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "connector=\`${{ steps.p.outputs.connector }}\` · include_api=\`${{ steps.p.outputs.include_api }}\` · 기간 ${{ steps.p.outputs.start_year }}~${{ steps.p.outputs.end_year }}" >> "$GITHUB_STEP_SUMMARY"
