# A-248: Trading Economics API → 수동 xlsx(연도 시트) 증분 갱신 — 승인자 구독 연장(2026-09) 반영.
# 샌드박스는 api.tradingeconomics.com 차단이라 Actions가 유일한 실행 표면.
# 발화: ①평일 21:30 UTC(=KST 06:30) 스케줄 — 미국 장 마감 이후·22:52 UTC 파이프라인 이전,
#       스냅샷 1행 append. ②자기 파일 push 1회(A-046 패턴). ③수동 dispatch(모드·품목 선택).
name: Trading Economics xlsx Update (API → 연도 시트 append)

on:
  schedule:
    - cron: "30 21 * * 1-5"     # 평일 21:30 UTC = KST 06:30 (미국 장 마감 후 · 일별 파이프라인 전)
  push:
    paths:
      - ".github/workflows/te_xlsx_update.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot=당일 1행 append(기본) · historical=공백 복구(창 조회)"
        required: false
        type: choice
        default: "snapshot"
        options:
          - snapshot
          - historical
      only:
        description: "갱신할 품목(쉼표 구분, 파일명 2번째 토큰 — 예: Soybeans,BDI). 비우면 전체"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: te-xlsx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            data/raw/Trading Economics
            data/schemas
            reports/market
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow openpyxl
      - name: Update xlsx from TE API
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          # schedule·push 발화 시 inputs가 비므로 기본값을 명시한다(argparse choices가 빈 값을 거부).
          TE_MODE: ${{ github.event.inputs.mode || 'snapshot' }}
          TE_ONLY: ${{ github.event.inputs.only || '' }}
        run: python scripts/update_te_xlsx_from_api.py --mode "$TE_MODE" --only "$TE_ONLY"
      - name: Rebuild TE parquet (검증 재판독)
        run: python scripts/ingest_te_xlsx.py
      - name: Commit updated xlsx + report
        run: |
          git config user.name "nexus-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/raw/Trading Economics" reports/market/te_api_update_*.md
          git commit -m "data: Trading Economics xlsx API 증분 갱신 ($(date -u +%F)) [A-248]" || { echo "변경 없음"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Summary
        if: always()
        run: |
          f=$(ls reports/market/te_api_update_*.md 2>/dev/null | tail -1)
          [ -n "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "보고서 없음" >> "$GITHUB_STEP_SUMMARY"
