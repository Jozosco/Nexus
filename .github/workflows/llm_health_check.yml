      # A-100: 구 스텝명은 'ECMWF CDS API (ERA5 connection)'이었으나 실제로는 Open-Meteo를
      # 호출하면서 CDS 인증 헤더를 붙이고, 403/404까지 '정상'으로 출력했다. 이 때문에
      # "HTTP 200인데 데이터가 안 보인다"는 혼선이 발생. 실수집원(Open-Meteo ERA5) 점검으로
      # 정정하고, **응답 본문의 관측값 개수까지 검증**해 수집 가능 여부를 확정한다.
      - name: Check Open-Meteo ERA5 Archive (기후 실수집원 — CDS 아님)
        continue-on-error: true   # 단일 API 실패가 후속 점검을 막지 않음 (Session 40)
        run: |
          python - <<'EOF'
          import os, httpx

          def _get_retry(url, params=None, timeout=60, tries=4):
              # A-085: 재시도에도 ConnectTimeout 재발(KOSIS·관세청) → GitHub 러너의 IPv6 경로가
              # 한국 공공기관 호스트에서 블랙홀되는 사례. local_address="0.0.0.0"로 IPv4 강제.
              import time as _t, socket
              last = None
              for i in range(tries):
                  for tr in (httpx.HTTPTransport(local_address="0.0.0.0", retries=1), None):
                      try:
                          with httpx.Client(transport=tr, timeout=timeout,
                                            follow_redirects=True) as c:
                              return c.get(url, params=params)
                      except httpx.TransportError as e:
                          last = e
                  _t.sleep(5 * (i + 1))
              raise last

          # Open-Meteo ERA5 아카이브는 **API 키 불요**(ECMWF_API_KEY는 이 경로에서 미사용).
          # CDS v2는 2024 CDS-Beta 이관으로 폐기(A-083) — 프로젝트는 CDS로 수집한 적이 없다.
          # 점검 지점: 미국 아이오와 대두 산지 격자(42.0N, 93.5W) 실측 일별 값.
          r = _get_retry(
              "https://archive-api.open-meteo.com/v1/era5",
              params={"latitude": 42.0, "longitude": -93.5,
                      "start_date": "2024-01-01", "end_date": "2024-01-07",
                      "daily": "temperature_2m_max,precipitation_sum"},
              timeout=60,
          )
          if r.status_code != 200:
              print(f"⚠️ Open-Meteo ERA5 HTTP {r.status_code} — 응답: {r.text[:150]}")
              raise SystemExit(0)
          data = r.json()
          daily = (data or {}).get("daily") or {}
          dates = daily.get("time") or []
          temps = [v for v in (daily.get("temperature_2m_max") or []) if v is not None]
          # 연결 성공(200)과 '값이 실제로 왔는가'를 분리 판정 — 구 스텝의 혼선 원인 제거
          if dates and temps:
              print(f"✅ Open-Meteo ERA5 정상 — {len(dates)}일 수신 "
                    f"({dates[0]}~{dates[-1]}), 최고기온 실측 {len(temps)}건 "
                    f"(예: {temps[0]}°C)")
              print("   ※ 기후 데이터 실수집은 climate_connector.py(Open-Meteo ERA5-Land, 12개 산지) 담당. "
                    "본 점검은 소스 가용성 확인용이며 자체적으로 저장하지 않음")
          else:
              print(f"⚠️ Open-Meteo ERA5 HTTP 200이나 관측값 없음 — 응답 키: {list(data)[:6]}")
          EOF

      - name: Check Korea Customs API — data.go.kr HS 1507 (MEMORY A-011, A-018)
        continue-on-error: true   # 단일 API 실패가 후속 점검을 막지 않음 (Session 40)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'EOF'
          import os, json, httpx

          def _get_retry(url, params=None, timeout=60, tries=4):
              # A-085: 재시도에도 ConnectTimeout 재발(KOSIS·관세청) → GitHub 러너의 IPv6 경로가
              # 한국 공공기관 호스트에서 블랙홀되는 사례. local_address="0.0.0.0"로 IPv4 강제.
              import time as _t, socket
              last = None
              for i in range(tries):
                  for tr in (httpx.HTTPTransport(local_address="0.0.0.0", retries=1), None):
                      try:
                          with httpx.Client(transport=tr, timeout=timeout,
                                            follow_redirects=True) as c:
                              return c.get(url, params=params)
                      except httpx.TransportError as e:
                          last = e
                  _t.sleep(5 * (i + 1))
              raise last

          from urllib.parse import unquote
          svc_key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "").strip()
          if not svc_key:
              print("⚠️ DATA_GO_KR_SERVICE_KEY 미등록 — 건너뜀 (data.go.kr에서 관세청 수출입실적 API 신청 필요)")
              raise SystemExit(0)
          # MEMORY A-018: 올바른 파라미터 — strtYymm/endYymm/hsSgn(10단위). 구 파라미터(hsCd/period/pageNo) 사용 금지
          # MEMORY A-015: 이중 인코딩 방지 — unquote() 후 params 전달
          decoded_key = unquote(svc_key)
          r = _get_retry(
              "http://apis.data.go.kr/1220000/nitemtrade/getNitemtradeList",
              params={
                  "serviceKey": decoded_key,
                  "strtYymm": "202501",
                  "endYymm":  "202501",
                  "hsSgn":    "1507901010",  # 정제 식용 대두유 (10단위 필수)
              },
              timeout=60,
          )
          r.raise_for_status()
          # A-080: 관세청 API는 **XML로 응답**(JSON 아님) — resultCode 00이면 정상.
          #        기존 r.json() 파싱은 구조적 오류였음(응답 자체는 정상 데이터).
          text = r.text
          if "<resultCode>00</resultCode>" not in text:
              snippet = text[:200].replace("\n", " ")
              raise AssertionError(f"[오류] 관세청 API 비정상 응답: {snippet}")
          count = text.count("<item>")
          print(f"✅ Korea Customs API 정상 — HS 1507901010 2025-01 수입 레코드 {count}건")
          EOF

