# 외부 URL → 저장소 파일 반입 (A-134)
#
# 왜 필요한가: 사내망에서 GitHub 웹 업로드가 반복 실패한다 —
#   ICE 2015·2016 xlsx는 최초 업로드부터 정확히 16,384B에서 절단됐고(D-036),
#   재업로드·zip 우회 모두 "Something went really wrong"으로 거부됐다.
#   프록시/DLP가 GitHub 업로드 스트림을 차단하는 것으로 추정되므로,
#   업로드가 되는 경로(Azure Blob 등)에 올린 뒤 **Actions가 끌어오는** 방향으로 우회한다.
#
# 사용법 (Azure Portal 기준):
#   1. Azure Portal → Storage account → 컨테이너 → 파일 업로드 (사내망에서 정상 동작)
#   2. 업로드한 blob → 'SAS 생성' → 읽기 권한·짧은 만료(1일)로 URL 복사
#   3. Actions 탭 → 이 워크플로우 → Run workflow:
#      file_url  = 복사한 SAS URL
#      dest_path = data/raw/ICE/Reports/Monthly Volumes/U.S./Futures/2015_Monthly Volumes Futures.xlsx
#   4. zip을 올렸으면 dest_path를 .zip으로 주면 자동 압축 해제 후 원위치 배치
#
# 보안: 반입만 한다(외부로 내보내지 않음). SAS URL은 실행 후 만료되게 짧게 발급할 것.
name: Fetch File From URL (사내망 업로드 차단 우회)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "다운로드 URL (Azure Blob SAS 등)"
        required: true
      dest_path:
        description: "저장소 내 대상 경로 (예: data/raw/ICE/.../2015_Monthly Volumes Futures.xlsx)"
        required: true
      unzip_to:
        description: "zip인 경우 압축 해제 대상 폴더 (비우면 해제 안 함)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Download file
        run: |
          mkdir -p "$(dirname "${{ github.event.inputs.dest_path }}")"
          curl -fSL --retry 3 -o "${{ github.event.inputs.dest_path }}" "${{ github.event.inputs.file_url }}"
          SIZE=$(stat -c%s "${{ github.event.inputs.dest_path }}")
          echo "[정보] 다운로드 완료: ${SIZE} bytes"
          # D-036 재발 방지: xlsx가 zip 시그니처로 시작하고 EOCD가 온전한지 검증
          case "${{ github.event.inputs.dest_path }}" in
            *.xlsx|*.zip)
              python3 -c "
          import zipfile, sys
          p = '${{ github.event.inputs.dest_path }}'
          try:
              names = zipfile.ZipFile(p).namelist()
              print(f'[검증] zip 구조 정상 — 내부 항목 {len(names)}개')
          except Exception as e:
              print(f'[오류] zip 구조 손상: {e} — 전송 중 절단 가능성, 커밋 중단')
              sys.exit(1)
          " ;;
          esac
      - name: Unzip if requested
        if: ${{ github.event.inputs.unzip_to != '' }}
        run: |
          mkdir -p "${{ github.event.inputs.unzip_to }}"
          unzip -o "${{ github.event.inputs.dest_path }}" -d "${{ github.event.inputs.unzip_to }}"
          rm "${{ github.event.inputs.dest_path }}"
          ls -la "${{ github.event.inputs.unzip_to }}"
      - name: Commit to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "data: 외부 URL 반입 — ${{ github.event.inputs.dest_path }} (A-134)" && git push origin HEAD:main)
