# GPT 교차검증 자동화 (조정자 지시 2026-08-13 · D-041)
# "모든 데이터 분석·코딩 작업은 GPT 5.6 - Sol (Effort - Max)로 교차검증한다."
#
# 발화 조건: main push 중 G2 운영 현실화 계층 산출물(src/forecasting·도착가 밴드·
#   4축 대안 보고서·온톨로지)이 바뀔 때 + 수동(workflow_dispatch).
#   → 이 워크플로우를 추가하는 push 자체가 위 경로를 포함하므로 즉시 1회 발화되어
#     방금 만든 G2 코드·산출물이 곧바로 GPT 검증을 받는다.
#
# ⚠️ 모델 ID: 기본값 'gpt-5.6-sol'이 OpenAI 실제 모델명과 다르면(404 등),
#   저장소 Settings → Actions Variables에 GPT_XVERIFY_MODEL을 등록해 교정한다
#   (코드 수정 불요 — L-008 전례: 모델명 하드코딩 금지).
#   스크립트는 호출 실패 시 경고만 남기고 exit 0 — 외부 서비스 장애가 우리 장애가
#   되지 않게 한다(cross_verify_gpt.py 설계 원칙).

name: GPT Cross-Verify (G2 Ops Layer)

on:
  push:
    branches: [main]
    paths:
      - "src/forecasting/**"
      - "reports/market/landed_cost_band_*.md"
      - "reports/market/procurement_alternatives_*.md"
      - "src/semantic/ontology.yaml"
      - "docs/research_desk/*/g1_publication_schedule_panel_*.md"   # 월 폴더 비고정 (GPT 정정)
      - "docs/research_desk/*/abcd_trading_structure_*.md"
      - "docs/research_desk/*/differentiation_brainstorm_*.md"
      - "docs/research_desk/*/glossary_*.md"
      - "docs/research_desk/*/knowledge_repository_*.md"
      - "docs/research_desk/*/hs_code_classification_*.md"
      - "docs/research_desk/*/hybrid_methodology_design_*.md"
  workflow_dispatch:

permissions:
  contents: write   # A-186: 판정 기록 커밋

concurrency:
  group: xverify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false          # 검증 기록은 중단 없이 남긴다

jobs:
  gpt-cross-verify:
    name: "GPT 교차검증 | diff + G2 산출물"
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GPT_XVERIFY_MODEL: ${{ vars.GPT_XVERIFY_MODEL || 'gpt-5.6-sol' }}
      GPT_XVERIFY_EFFORT: "xhigh"   # A-166: gpt-5.6-sol은 max 미지원(400) — 지원 최대치 xhigh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2             # --diff HEAD~1 대조용
          sparse-checkout: |
            src
            scripts
            reports
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openai
      - name: Cross-verify commit diff (HEAD~1)
        shell: bash
        run: python scripts/cross_verify_gpt.py --diff HEAD~1
      - name: Cross-verify G2 ops reports (도착가 밴드 · 4축 대안)
        shell: bash
        # A-171: 4패턴 일괄 호출이 대용량 입력으로 APIConnectionError 2연속(런 #5·#6) —
        #   글로브별 개별 호출로 요청 크기 축소. 스크립트는 호출 실패 시 비치명(exit 0).
        run: |
          for g in "reports/market/landed_cost_band_*.md" \
                   "reports/market/procurement_alternatives_*.md" \
                   "docs/research_desk/*/g1_publication_schedule_panel_*.md" \
                   "docs/research_desk/*/abcd_trading_structure_*.md" \
                   "docs/research_desk/*/differentiation_brainstorm_*.md" \
                   "docs/research_desk/*/glossary_*.md" \
                   "docs/research_desk/*/knowledge_repository_*.md" \
                   "docs/research_desk/*/hs_code_classification_*.md" \
                   "docs/research_desk/*/hybrid_methodology_design_*.md"; do
            python scripts/cross_verify_gpt.py "$g"
          done
      - name: Build ledger & commit verdicts (A-186 · A-208 — 저장소 보존·단일 열람 지점)
        if: always()
        # A-208 재배열: 구 순서(원장 재생성 → pull --rebase)는 체크아웃이 트리거 SHA에
        #   고정된 채 낡은 트리 기준으로 원장을 통째로 재생성해, 장시간 런(40~60분)이
        #   연쇄되는 날 선행 런의 원장 커밋과 반드시 충돌했다(8/25 런 #15·#17·#21).
        #   신 순서: ①판정문만 선커밋(run_id 신규 파일 — 무충돌) ②rebase로 최신 원장
        #   확보 ③최신 트리 기준 원장 재생성·커밋 ④push, 경합 시 원장 커밋만 되돌려
        #   유한 재시도. 최종 실패도 비치명 — 판정문은 아티팩트(if always)로 보존.
        run: |
          git config user.name "nexus-xverify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/cross_verify 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "docs: GPT 교차검증 판정문 ($(date -u +%F) run ${{ github.run_id }}) [A-186]"
          fi
          success=0
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "[경고] rebase 실패(시도 $i) — 재시도"; sleep $((i*5)); continue
            fi
            if [ "$i" = "1" ]; then
              python scripts/build_cross_verify_log.py | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
            else
              python scripts/build_cross_verify_log.py >/dev/null
            fi
            git add docs/research_desk/cross_verify_log.md
            ledger_committed=0
            if ! git diff --cached --quiet; then
              git commit -m "docs: GPT 교차검증 원장 갱신 ($(date -u +%F)) [A-186]"
              ledger_committed=1
            fi
            if [ "$(git rev-list origin/main..HEAD --count)" = "0" ]; then
              echo "푸시할 변경 없음 — 종료"; success=1; break
            fi
            if git push origin HEAD:main; then success=1; break; fi
            # push 경합 — 원장 커밋만 되돌리고(판정문 커밋은 유지) 다음 루프에서 재생성
            [ "$ledger_committed" = "1" ] && git reset --hard HEAD~1
            sleep $((i*5))
          done
          if [ "$success" != "1" ]; then
            echo "::warning::[경고] 원장 push 3회 실패 — 판정문은 아티팩트로 보존(비치명 종료)"
          fi
          exit 0
      - name: Upload verification artifacts
        # A-208: 커밋 스텝 실패 시에도 판정문 보존 — 유실 차단(런 #15·#17·#21에서 소실 실증)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-xverify-g2-${{ github.run_id }}
          path: reports/cross_verify/
          retention-days: 90
          if-no-files-found: warn    # 키 미등록 시 검증 건너뜀 — 산출물 없음이 정상
