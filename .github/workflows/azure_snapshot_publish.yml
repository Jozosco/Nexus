# ⛔ DEPRECATED 2026-09-02 — 2026-09-01 클라우드 대통합 상세 수령 — Azure 전면 폐지(Power BI 제외). 실행 이력 0 · S3 버전으로 교체 예정(삭제는 S3 실증 후).
name: Azure Storage Model-Ready Snapshot

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "검증할 Historical/Data Integration workflow run ID"
        required: true
      snapshot_id:
        description: "불변 snapshot ID (비우면 현재 run ID)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-model-ready-snapshot
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: "Validate → Feature Mart → Blob Snapshot"
    runs-on: ubuntu-latest
    environment: azure-preview
    steps:
      - uses: actions/checkout@v4
      - name: Download source-run artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation and Azure dependencies
        run: >-
          pip install pandas numpy pyarrow duckdb pyyaml
          azure-identity azure-storage-blob
      - name: Strict as-of gate
        env:
          ASOF_EXEMPT: ${{ vars.ASOF_EXEMPT }}
        run: python scripts/validate_asof.py
      - name: Target and core-feature readiness gate
        run: python scripts/data_readiness.py
      - name: Build and independently verify feature mart
        run: |
          python src/features/build_feature_mart.py --self-test
          python src/features/build_feature_mart.py
      - name: Azure login with OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish immutable model-ready snapshot
        env:
          AZURE_STORAGE_ACCOUNT_URL: ${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          NEXUS_SNAPSHOT_ID: ${{ inputs.snapshot_id || format('run-{0}', github.run_id) }}
        run: >-
          python scripts/publish_blob_snapshot.py
          data/gold/feature_mart.parquet
          data/gold/feature_contract.yaml
          reports/market/data_readiness_*.md
          reports/market/feature_mart_*.md
