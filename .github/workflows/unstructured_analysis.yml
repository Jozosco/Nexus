# Unstructured Analysis Pipeline — 비정형 문서 전용 워크플로우 (Session 44 · C-01 결정)
#
# 분리 근거(C-01 재검토 — 조정자 Req):
#   ① 실행 프로파일 상이: GAIN 1,371건 + FAO 137건 PDF 요약은 장시간 실행 —
#      정형 수집(Historical Analysis Pipeline)과 묶으면 실패 결합·대기 지연 발생.
#   ② 재실행 주기 상이: 정형 백필=대량 1회성, 비정형 요약=신규 PDF 유입 시·추출기 버전
#      갱신 시 반복 실행. 별도 트리거가 운영상 명확.
#   ③ 산출 경로 상이: Summary md·인덱스·신호 시계열은 실행 아티팩트로 전달하고,
#      검증되지 않은 생성물을 워크플로우에서 main에 직접 커밋하지 않는다.
#   ④ Phase B 확장 대비: LLM 정밀 요약(P1-05)·시맨틱 추출(P1-06)은 API 비용 게이트가
#      필요 — 워크플로우 입력값으로 단계 제어.
#
# 체인: C-04(판독·추출) → P1-05(신호) → P1-06(시맨틱) → 시계열화 → G1 통합 분석 입력
# 참조: src/semantic/provenance.yaml(근거 계약) · reports/market/drm_blocked_documents.md(DRM 목록)
name: Unstructured Analysis Pipeline (비정형 문서 → 요약·신호·시계열)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "대상 (all / gain / fao / timeseries-only)"
        required: true
        default: "all"
      gain_year:
        description: "GAIN 특정 연도만 (예 2020 — 비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: unstructured-analysis
  cancel-in-progress: false

jobs:
  # ── 1 | FAO AMIS 요약 (요약 스킴 v2: AMIS/{YYYY}/Summary/) ─────────────────
  fao-summarize:
    name: "1.1.41b | FAO AMIS PDF 요약 (137건)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'fao' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber pypdf pandas pyyaml
      - name: Summarize FAO AMIS PDFs
        run: python scripts/summarize_pdfs.py fao
      - name: Upload summaries and index artifact
        uses: actions/upload-artifact@v4
        with:
          name: unstructured-index-fao-${{ github.run_id }}
          path: |
            data/raw/FAO/**/Summary/**
            data/processed/unstructured_index_fao.csv
          retention-days: 90
          if-no-files-found: error

  # ── 2 | GAIN 판독·요약 (요약 스킴 v2: {sub}/{YYYY}/{MM}/Summary/) ──────────
  gain-summarize:
    name: "1.1.43 | GAIN PDF 판독·요약 (1,371건 · DRM 자동 건너뜀)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'gain' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber pypdf pandas pyarrow pyyaml
      - name: Ingest GAIN PDFs (메타·신호 parquet — DRM 사전 판정)
        run: python scripts/ingest_gain_pdf.py
      - name: Summarize GAIN PDFs (Summary 폴더 v2)
        run: python scripts/summarize_pdfs.py gain ${{ github.event.inputs.gain_year }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unstructured-gain-${{ github.run_id }}
          path: |
            data/raw/gain_historical.parquet
            data/raw/USDA/FAS/GAIN/**/Summary/**
            data/processed/unstructured_index_gain.csv
          retention-days: 90
          if-no-files-found: error

  # ── 3 | 비정형 신호 시계열화 (G1 통합 분석 입력) ────────────────────────────
  unstructured-timeseries:
    name: "1.1.53 | 비정형 신호 시계열화 (월별 태그·톤 → parquet)"
    runs-on: ubuntu-latest
    needs: [fao-summarize, gain-summarize]
    # 선행 잡이 건너뛰어져도 실행 (timeseries-only 지원) — 실패 시에는 중단
    if: ${{ !cancelled() && needs.fao-summarize.result != 'failure' && needs.gain-summarize.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: >-
          needs.fao-summarize.result == 'success' ||
          needs.gain-summarize.result == 'success'
        with:
          path: .
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Build unstructured signal time series
        # parquet은 커밋하지 않음(.gitignore) — 아티팩트 + 각 파이프라인이 인덱스 CSV로 재생성
        run: python scripts/build_unstructured_timeseries.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unstructured-signals-${{ github.run_id }}
          path: data/raw/unstructured_signals_historical.parquet
          retention-days: 90
          if-no-files-found: error
      - name: Pipeline summary (DRM 현황 포함)
        # A-046 교훈: YAML 블록 내 heredoc 금지 — python -c 단일 호출로 대체
        run: |
          echo "## 비정형 분석 파이프라인 요약" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 산출물 | 상태 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| FAO Summary v2 | ${{ needs.fao-summarize.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GAIN Summary v2 | ${{ needs.gain-summarize.result }} |" >> "$GITHUB_STEP_SUMMARY"
          python -c "import pandas as pd; df=pd.read_parquet('data/raw/unstructured_signals_historical.parquet'); print(f'| 신호 시계열 | {len(df):,}행 · {df[\"indicator_code\"].nunique()}개 지표 |')" >> "$GITHUB_STEP_SUMMARY" || true
          python -c "import pandas as pd; gd=pd.read_parquet('data/raw/gain_historical.parquet'); print(f'| GAIN 판독 | 총 {len(gd):,}건 · DRM 차단 {int(gd[\"note\"].astype(str).str.contains(\"DRM\").sum())}건 (목록: reports/market/drm_blocked_documents.md) |')" >> "$GITHUB_STEP_SUMMARY" || true
