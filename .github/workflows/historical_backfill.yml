name: Historical Analysis Pipeline (2010~) — 과거 데이터 기반 현황·대안 분석

# 역할(C-01·C-03 협의, Session 36): 2010년 이후 확보 히스토리(data/raw 수동 업로드)를
#   정형화·분석하여 ①공급/수요·가격 변동 추세와 유의 인자·논리 파악 ②현재와 유사한 과거
#   사례(호르무즈 지정학·바이오디젤 정책 등)의 영향도 규명. → 현황 진단·대안 수립.
#   (구 'Historical Data Backfill — 2017~현재'에서 개명, 스코프 2010~ 확장)
#
# Req 1.2.1: 이 파이프라인은 **히스토리(수동 업로드) 데이터 전용** — 실시간 API 호출 제외.
#   include_api=true 로 명시할 때만 API 커넥터 실행(기본 제외). 실행: workflow_dispatch 전용.
# 실행 기준: 과거 연도 신규/수정 데이터가 있을 때만 실행(불필요 시 미실행) — 조정자 결정.
#
# HITL 준수: 분석은 데이터 이해 목적 — 조달 실행은 별도 CLAUDE.md §6 게이트 통과 필요
# 보안 경계: 내부 ERP 데이터는 이 워크플로우에서 절대 처리하지 않음 (D-021)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "수집 시작 연도 (기본: 2010)"
        required: false
        default: "2010"
      end_year:
        description: "수집 종료 연도 (기본: 2026)"
        required: false
        default: "2026"
      connector:
        description: "특정 커넥터만 실행 (all / usda-xlsx / gain-pdf / fao-amis / customs-gw / databento / gpr)"
        required: false
        default: "all"
      include_api:
        description: "실시간 API 커넥터 포함 여부 (기본 false — 히스토리 전용, Req 1.2.1)"
        required: false
        default: "false"
      skip_analysis:
        description: "수집 후 C-08/C-06/G1 분석 건너뛰기 (true / false)"
        required: false
        default: "false"

# A-083: github-actions[bot] push 403의 근본 원인 — permissions 블록 부재 시 GITHUB_TOKEN이
# 읽기 전용으로 발급됨. Databento/GAIN 요약/customs-gw의 main 커밋에 write 필요.
permissions:
  contents: write

jobs:
  # ── WBS 1.1.2: 경제 지표 히스토리 ────────────────────────────────────────────
  economic-backfill:
    name: "1.1.2 | Economic Indicators Backfill (FRED · BOK ECOS · EIA)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'economic') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run economic connector (historical)
        env:
          FRED_API_KEY:               ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:                ${{ secrets.EIA_API_KEY }}
          BOK_ECOS_API_KEY:           ${{ secrets.BOK_ECOS_API_KEY }}
          KOSIS_API_KEY:              ${{ secrets.KOSIS_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/economic_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-economic-${{ github.run_id }}
          path: data/raw/economic_indicators_*.parquet
          retention-days: 90

  # ── WBS 1.1.3: 해운 지수 히스토리 ─────────────────────────────────────────────
  # BACKFILL_MODE=true: BCAA(Perplexity, 오늘만) 건너뜀 → TE BDI 히스토리 / stooq 폴백
  # stooq 폴백: httpx로 stooq CSV 직접 다운로드(^bdi) — API 키 불필요 (A-053)
  shipping-backfill:
    name: "1.1.3 | Shipping Indices Backfill (BDI via TE → stooq fallback)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'shipping') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # httpx: stooq CSV 직접 호출 (pandas-datareader 제거 — pandas 2.x 비호환, A-053)
        run: pip install openai httpx pandas pyarrow tradingeconomics
      - name: Run shipping connector (historical)
        env:
          PERPLEXITY_API_KEY:         ${{ secrets.PERPLEXITY_API_KEY }}
          TRADING_ECONOMICS_API_KEY:  ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/shipping_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-shipping-${{ github.run_id }}
          path: data/raw/shipping_indices_*.parquet
          retention-days: 90

  # ── WBS 1.1.4: WASDE 히스토리 ─────────────────────────────────────────────────
  wasde-backfill:
    name: "1.1.4 | WASDE / USDA Crop Data Backfill (FAS OpenData)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'wasde') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run WASDE connector (historical)
        env:
          USDA_FAS_API_KEY:           ${{ secrets.USDA_FAS_API_KEY }}
          USDA_FAS_PSD_API_KEY:       ${{ secrets.USDA_FAS_PSD_API_KEY }}
          USDA_ARM_API_KEY:           ${{ secrets.USDA_ARM_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/wasde_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-wasde-${{ github.run_id }}
          path: data/raw/crop_data_*.parquet
          retention-days: 90

  # ── WBS 1.1.5: 기후 히스토리 — Open-Meteo ERA5-Land 12개 생산지역 ──────────────
  # API 키 불필요. BACKFILL_MODE: 시작일 = HISTORICAL_START_YEAR-01-01
  climate-backfill:
    name: "1.1.5 | Climate Backfill — Open-Meteo ERA5-Land (12 Production Regions)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'climate') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run climate connector (historical)
        env:
          ECMWF_API_KEY:              ${{ secrets.ECMWF_API_KEY }}
          OPENWEATHERMAP_API_KEY:     ""
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/climate_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-climate-${{ github.run_id }}
          path: data/raw/climate_data_*.parquet
          retention-days: 90

  # ── WBS 1.1.6: GPR 지수 히스토리 ──────────────────────────────────────────────
  # BACKFILL_MODE=true: Perplexity 실시간(오늘만) 건너뜀 → C&I 공개 xlsx만 수집
  # openpyxl 필수: pd.read_excel()로 Caldara & Iacoviello GPR xlsx 파싱 (MEMORY A-030)
  gpr-backfill:
    name: "1.1.6 | GPR Backfill (Caldara & Iacoviello — 공개 xlsx, 1985-현재)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'gpr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx openai pandas pyarrow openpyxl
      - name: Run GPR connector (historical — Perplexity 건너뜀)
        env:
          PERPLEXITY_API_KEY:         ${{ secrets.PERPLEXITY_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/gpr_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gpr-${{ github.run_id }}
          path: data/raw/geopolitical_indices_*.parquet
          retention-days: 90

  # ── WBS 1.1.7: 생산량 히스토리 ───────────────────────────────────────────────
  production-backfill:
    name: "1.1.7 | Production & Agromet Backfill (USDA NASS · FAOSTAT · FAS ESR)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'production') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx openai pandas pyarrow
      - name: Run production connector (historical)
        env:
          USDA_NASS_QUICKSTATS_API_KEY: ${{ secrets.USDA_NASS_QUICKSTATS_API_KEY }}
          USDA_API_KEY:               ${{ secrets.USDA_API_KEY }}
          PERPLEXITY_API_KEY:         ${{ secrets.PERPLEXITY_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/production_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-production-${{ github.run_id }}
          path: data/raw/production_data_*.parquet
          retention-days: 90

  # ── 상품 가격 히스토리 ────────────────────────────────────────────────────────
  commodity-backfill:
    name: "Commodity Prices Backfill (CBOT BO=F · ARS/USD · USDM Drought)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'commodity') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx yfinance curl_cffi pandas pyarrow tradingeconomics
      - name: Run commodity connector (historical)
        env:
          FRED_API_KEY:               ${{ secrets.FRED_API_KEY }}
          NASDAQ_DATALINK_API_KEY:    ${{ secrets.NASDAQ_DATALINK_API_KEY }}
          TRADING_ECONOMICS_API_KEY:  ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/commodity_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-commodity-${{ github.run_id }}
          path: data/raw/commodity_data_*.parquet
          retention-days: 90

  # ── WBS 1.1.2+: 관세청 수입통계 히스토리 ──────────────────────────────────────
  customs-backfill:
    name: "1.1.2+ | Korea Customs HS 1507 Import Backfill (data.go.kr)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'customs') && github.event.inputs.include_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow comtradeapicall
      - name: Run customs connector (historical backfill)
        env:
          DATA_GO_KR_SERVICE_KEY:     ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          UN_COMTRADE_API_KEY:        ${{ secrets.UN_COMTRADE_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/customs_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-customs-${{ github.run_id }}
          path: data/raw/customs_import_*.parquet
          retention-days: 90

  # ── WBS 1.1.41b: FAO AMIS Market Monitor PDF 수동 수집 ─────────────────────────
  # PDF가 data/raw/FAO/AMIS/에 커밋된 경우에만 실행 (API 키 불필요)
  fao-amis-ingest:
    name: "1.1.41b | FAO AMIS PDF Ingest (수동 업로드 배치)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'fao-amis' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber pandas pyarrow
      - name: Check for FAO AMIS PDFs
        id: check_pdf
        run: |
          COUNT=$(find data/raw/FAO/AMIS -name "*.pdf" 2>/dev/null | wc -l)
          echo "pdf_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "FAO AMIS PDF 파일 수: $COUNT"
      - name: Run FAO AMIS PDF ingest
        if: steps.check_pdf.outputs.pdf_count != '0'
        run: python scripts/ingest_fao_amis_pdf.py
      - name: Upload FAO AMIS output
        if: steps.check_pdf.outputs.pdf_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-fao-amis-${{ github.run_id }}
          path: data/raw/fao_amis_historical.parquet
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.52: Databento CBOT 대두유 선물(ZL) 15개년 (A-081) ────────────────
  databento-bo:
    name: "1.1.52 | Databento BO=F/ZL 15개년 (GLBX.MDP3 · ohlcv-1d)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'databento' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install databento pandas pyarrow openpyxl
      - name: Run Databento ZL ingest
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          DATABENTO_START:   "2010-06-06"
        run: python scripts/ingest_databento_bo.py
      - name: Commit collected files to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/Databento || true
          git diff --cached --quiet || (git commit -m "data: Databento ZL(BO=F) 15개년 수집 (A-081)" && git push origin HEAD:main)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: databento-bo-${{ github.run_id }}
          path: |
            data/raw/Databento/**
            data/raw/databento_bo_historical.parquet
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.48: 관세청 GW 확장 수집 (대체·보완재 × 확대 원산지) ────────────────
  # 업로드본과 동일 포맷(연도시트×월행×5지표)으로 품목(HS)별·국가별 xlsx 생성 (A-073)
  # data.go.kr REST — 개발 샌드박스 프록시 차단이라 Actions에서만 수집 가능(A-069)
  customs-gw-extended:
    name: "1.1.48 | Korea Customs GW Extended (대체·보완재 HS × 원산지)"
    runs-on: ubuntu-latest
    # A-094: 6시간 강제 취소로 수집분 전량 유실 → 잡 상한을 240분으로 낮추고,
    # 스크립트 내부 예산(CUSTOMS_TIME_BUDGET_S)이 그보다 먼저 만료돼 저장 후 정상 종료하게 함.
    timeout-minutes: 240
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'customs-gw' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow openpyxl
      - name: Preflight — data.go.kr 연결 진단 (DNS·TCP·HTTP 분리)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        continue-on-error: true
        run: python scripts/diagnose_kr_hosts.py
      - name: Run Korea Customs GW extended ingest
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          HISTORICAL_START_YEAR:  ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:    ${{ github.event.inputs.end_year }}
          CUSTOMS_TIME_BUDGET_S:  "10800"   # 3시간 — 잡 상한(240분)보다 먼저 만료
        run: python scripts/ingest_customs_gw_xlsx.py
      - name: Upload customs GW outputs
        uses: actions/upload-artifact@v4
        with:
          name: customs-gw-extended-${{ github.run_id }}
          path: |
            data/raw/customs_gw_historical.parquet
            data/raw/관세청/**/*.xlsx
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.43: USDA FAS GAIN 보고서 PDF 판독·요약 (Oilseeds + Biofuels) ──────
  # GAIN PDF를 판독해 연·월·국가별 요약(.md) + 메타/신호 parquet 생성.
  # 파일명 규칙 YY.MM_Country_Title.pdf. API 키 불필요. (A-058)
  gain-pdf-ingest:
    name: "1.1.43 | USDA FAS GAIN PDF Ingest (연·월·국가별 요약)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'gain-pdf' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber pandas pyarrow
      - name: Check for GAIN PDFs
        id: check_pdf
        run: |
          COUNT=$(find data/raw/USDA/FAS/GAIN -name "*.pdf" 2>/dev/null | wc -l)
          echo "pdf_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "GAIN PDF 파일 수: $COUNT"
      - name: Run GAIN PDF ingest
        if: steps.check_pdf.outputs.pdf_count != '0'
        run: python scripts/ingest_gain_pdf.py
      # Session 44: 요약 md 생성은 Unstructured Analysis Pipeline(unstructured_analysis.yml)로
      # 분리 — 본 잡은 G1 입력용 판독 parquet만 산출(정형·비정형 파이프라인 관심사 분리).
      - name: Upload GAIN metadata parquet
        if: steps.check_pdf.outputs.pdf_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gain-pdf-${{ github.run_id }}
          path: data/raw/gain_historical.parquet
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.42: USDA FAS 수동 업로드 Excel 수집 (WASDE · PSD · GATS) ──────────
  # main 브랜치에 수동 업로드된 Excel 파일을 Parquet으로 변환.
  # API 키 불필요. 파일이 없으면 각 단계가 자동 건너뜀.
  usda-manual-xlsx-ingest:
    name: "1.1.42 | USDA FAS Manual Excel Ingest (WASDE · PSD · GATS)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'usda-xlsx' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openpyxl pandas pyarrow

      - name: Check for WASDE Excel files
        id: check_wasde
        run: |
          COUNT=$(find data/raw/USDA/WASDE -name "*.xlsx" 2>/dev/null | wc -l)
