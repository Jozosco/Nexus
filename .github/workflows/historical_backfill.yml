name: Historical Analysis Pipeline (2010~) — 과거 데이터 기반 현황·대안 분석

# 역할(C-01·C-03 협의, Session 36): 2010년 이후 확보 히스토리(data/raw 수동 업로드)를
#   정형화·분석하여 ①공급/수요·가격 변동 추세와 유의 인자·논리 파악 ②현재와 유사한 과거
#   사례(호르무즈 지정학·바이오디젤 정책 등)의 영향도 규명. → 현황 진단·대안 수립.
#   (구 'Historical Data Backfill — 2017~현재'에서 개명, 스코프 2010~ 확장)
#
# Req 1.2.1: 이 파이프라인은 **히스토리(수동 업로드) 데이터 전용** — 실시간 API 호출 제외.
#   include_api=true 로 명시할 때만 API 커넥터 실행(기본 제외). 실행: workflow_dispatch 전용.
# 실행 기준: 과거 연도 신규/수정 데이터가 있을 때만 실행(불필요 시 미실행) — 조정자 결정.
#
# HITL 준수: 분석은 데이터 이해 목적 — 조달 실행은 별도 CLAUDE.md §6 게이트 통과 필요
# 보안 경계: 내부 ERP 데이터는 이 워크플로우에서 절대 처리하지 않음 (D-021)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "수집 시작 연도 (기본: 2010)"
        required: false
        default: "2010"
      end_year:
        description: "수집 종료 연도 (기본: 2026)"
        required: false
        default: "2026"
      connector:
        description: "특정 커넥터만 실행 (all / usda-xlsx / gain-pdf / fao-amis / customs-gw / databento / gpr)"
        required: false
        default: "all"
      include_api:
        description: "실시간 API 커넥터 포함 여부 (기본 false — 히스토리 전용, Req 1.2.1)"
        required: false
        default: "false"
      skip_analysis:
        description: "수집 후 C-08/C-06/G1 분석 건너뛰기 (true / false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  # ── WBS 1.1.2: 경제 지표 히스토리 ────────────────────────────────────────────
  economic-backfill:
    name: "1.1.2 | Economic Indicators Backfill (FRED · BOK ECOS · EIA)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'economic') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문(GAIN·FAO PDF 등 1.5GB) 불필요,
      #   sparse checkout으로 체크아웃 수십 MB 경량화 (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run economic connector (historical)
        env:
          FRED_API_KEY:               ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:                ${{ secrets.EIA_API_KEY }}
          BOK_ECOS_API_KEY:           ${{ secrets.BOK_ECOS_API_KEY }}
          KOSIS_API_KEY:              ${{ secrets.KOSIS_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/economic_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-economic-${{ github.run_id }}
          path: data/raw/economic_indicators_*.parquet
          retention-days: 90

  # ── WBS 1.1.3: 해운 지수 히스토리 ─────────────────────────────────────────────
  # BACKFILL_MODE=true: BCAA(Perplexity, 오늘만) 건너뜀 → TE BDI 히스토리 / stooq 폴백
  # stooq 폴백: httpx로 stooq CSV 직접 다운로드(^bdi) — API 키 불필요 (A-053)
  shipping-backfill:
    name: "1.1.3 | Shipping Indices Backfill (BDI via TE → stooq fallback)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'shipping') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # httpx: stooq CSV 직접 호출 (pandas-datareader 제거 — pandas 2.x 비호환, A-053)
        run: pip install openai httpx pandas pyarrow tradingeconomics
      - name: Run shipping connector (historical)
        env:
          PERPLEXITY_API_KEY:         ${{ secrets.PERPLEXITY_API_KEY }}
          TRADING_ECONOMICS_API_KEY:  ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/shipping_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-shipping-${{ github.run_id }}
          path: data/raw/shipping_indices_*.parquet
          retention-days: 90

  # ── WBS 1.1.4: WASDE 히스토리 ─────────────────────────────────────────────────
  wasde-backfill:
    name: "1.1.4 | WASDE / USDA Crop Data Backfill (FAS OpenData)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'wasde') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run WASDE connector (historical)
        env:
          USDA_FAS_API_KEY:           ${{ secrets.USDA_FAS_API_KEY }}
          USDA_FAS_PSD_API_KEY:       ${{ secrets.USDA_FAS_PSD_API_KEY }}
          USDA_ARM_API_KEY:           ${{ secrets.USDA_ARM_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/wasde_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-wasde-${{ github.run_id }}
          path: data/raw/crop_data_*.parquet
          retention-days: 90

  # ── WBS 1.1.5: 기후 히스토리 — Open-Meteo ERA5-Land 12개 생산지역 ──────────────
  # API 키 불필요. BACKFILL_MODE: 시작일 = HISTORICAL_START_YEAR-01-01
  climate-backfill:
    name: "1.1.5 | Climate Backfill — Open-Meteo ERA5-Land (12 Production Regions)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'climate') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run climate connector (historical)
        env:
          ECMWF_API_KEY:              ${{ secrets.ECMWF_API_KEY }}
          OPENWEATHERMAP_API_KEY:     ${{ secrets.OPENWEATHERMAP_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/climate_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-climate-${{ github.run_id }}
          path: data/raw/climate_data_*.parquet
          retention-days: 90

  # ── WBS 1.1.6: GPR 지수 히스토리 ──────────────────────────────────────────────
  # BACKFILL_MODE=true: Perplexity 실시간(오늘만) 건너뜀 → C&I 공개 xlsx만 수집
  # openpyxl 필수: pd.read_excel()로 Caldara & Iacoviello GPR xlsx 파싱 (MEMORY A-030)
  gpr-backfill:
    name: "1.1.6 | GPR Backfill (Caldara & Iacoviello — 공개 xlsx, 1985-현재)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'gpr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # xlrd 필수: GPR 원본이 .xls(구형 포맷) — pd.read_excel 엔진이 xlrd를 요구 (MEMORY A-147)
        run: pip install httpx openai pandas pyarrow openpyxl xlrd
      - name: Run GPR connector (historical — Perplexity 건너뜀)
        env:
          PERPLEXITY_API_KEY:         ${{ secrets.PERPLEXITY_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/gpr_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gpr-${{ github.run_id }}
          path: data/raw/geopolitical_indices_*.parquet
          retention-days: 90

  # ── WBS 1.1.7: 생산량 히스토리 ───────────────────────────────────────────────
  production-backfill:
    name: "1.1.7 | Production & Agromet Backfill (USDA NASS · FAOSTAT · FAS ESR)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'production') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx openai pandas pyarrow
      - name: Run production connector (historical)
        env:
          USDA_NASS_QUICKSTATS_API_KEY: ${{ secrets.USDA_NASS_QUICKSTATS_API_KEY }}
          # A-161: ESR 403의 원인 — 이 잡 env에 FAS 키가 없어 인증 3방식 전부 무키 시도
          USDA_FAS_API_KEY:     ${{ secrets.USDA_FAS_API_KEY }}
          USDA_FAS_PSD_API_KEY: ${{ secrets.USDA_FAS_PSD_API_KEY }}
          USDA_API_KEY:               ${{ secrets.USDA_API_KEY }}
          PERPLEXITY_API_KEY:         ${{ secrets.PERPLEXITY_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/production_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-production-${{ github.run_id }}
          path: data/raw/production_data_*.parquet
          retention-days: 90

  # ── 상품 가격 히스토리 ────────────────────────────────────────────────────────
  commodity-backfill:
    name: "Commodity Prices Backfill (CBOT BO=F · ARS/USD · USDM Drought)"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'commodity') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx yfinance curl_cffi pandas pyarrow tradingeconomics
      - name: Run commodity connector (historical)
        env:
          FRED_API_KEY:               ${{ secrets.FRED_API_KEY }}
          NASDAQ_DATALINK_API_KEY:    ${{ secrets.NASDAQ_DATALINK_API_KEY }}
          TRADING_ECONOMICS_API_KEY:  ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
        run: python src/pipeline/connectors/commodity_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-commodity-${{ github.run_id }}
          path: data/raw/commodity_data_*.parquet
          retention-days: 90

  # ── WBS 1.1.2+: 관세청 수입통계 히스토리 ──────────────────────────────────────
  customs-backfill:
    name: "1.1.2+ | Korea Customs HS 1507 Import Backfill (data.go.kr)"
    runs-on: ubuntu-latest
    timeout-minutes: 90   # A-166: data.go.kr 장애 시 6h 러너 소진 방지(런 31758600044 cancelled)
    if: ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == 'customs') && github.event.inputs.include_api == 'true' }}
    steps:
      # A-136: include_api 게이트 API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow comtradeapicall
      - name: Run customs connector (historical backfill)
        env:
          DATA_GO_KR_SERVICE_KEY:     ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          UN_COMTRADE_API_KEY:        ${{ secrets.UN_COMTRADE_API_KEY }}
          HISTORICAL_START_YEAR:      ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:        ${{ github.event.inputs.end_year }}
          BACKFILL_MODE:              "true"
          # 잡 timeout-minutes(90)보다 먼저 스스로 중단·저장 — 강제종료 유실 방지 (A-167)
          CUSTOMS_TIME_BUDGET_S:      "4500"
        run: python src/pipeline/connectors/customs_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: backfill-customs-${{ github.run_id }}
          path: data/raw/customs_import_*.parquet
          retention-days: 90

  # ── WBS 1.1.41b: FAO AMIS Market Monitor PDF 수동 수집 ─────────────────────────
  # PDF가 data/raw/FAO/AMIS/에 커밋된 경우에만 실행 (API 키 불필요)
  fao-amis-ingest:
    name: "1.1.41b | FAO AMIS PDF Ingest (수동 업로드 배치)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'fao-amis' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber pandas pyarrow
      - name: Check for FAO AMIS PDFs
        id: check_pdf
        run: |
          COUNT=$(find data/raw/FAO/AMIS -name "*.pdf" 2>/dev/null | wc -l)
          echo "pdf_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "FAO AMIS PDF 파일 수: $COUNT"
      - name: Run FAO AMIS PDF ingest
        if: steps.check_pdf.outputs.pdf_count != '0'
        run: python scripts/ingest_fao_amis_pdf.py
      - name: Upload FAO AMIS output
        if: steps.check_pdf.outputs.pdf_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-fao-amis-${{ github.run_id }}
          path: data/raw/fao_amis_historical.parquet
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.52: Databento CBOT 대두유 선물(ZL) 15개년 (A-081) ────────────────
  databento-bo:
    name: "1.1.52 | Databento BO=F/ZL 15개년 (GLBX.MDP3 · ohlcv-1d)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'databento' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install databento pandas pyarrow openpyxl yfinance curl_cffi
      - name: Run Databento ZL ingest
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          DATABENTO_START:   "2010-06-06"
        run: |
          if [ -n "$DATABENTO_API_KEY" ]; then
            python scripts/ingest_databento_bo.py
          else
            CSV_PATH=$(find data/raw/Databento/GLBX.MDP3 -name 'ZL_ohlcv-1d_*.csv' -type f | sort | tail -n 1)
            test -n "$CSV_PATH" || { echo "Databento API key and captured CSV are both unavailable" >&2; exit 1; }
            DATABENTO_FROM_CSV="$CSV_PATH" python scripts/ingest_databento_bo.py
          fi
      # A-145: UTC 종가 vs 정산가(yfinance) 교차검증 — PASS 시 cbot_session_close.parquet 발행
      #        (게이트 (b)경로: 공식 정산가 표본 교차검증). exit 2 = 표본 미확보 → 잡 실패 아님.
      - name: Validate session close (A-145)
        run: |
          set +e
          python scripts/validate_session_close.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning::세션 종가 검증 불가 — 정산가 표본 미확보 (CBOT_BO_CLOSE 미발행)"
            exit 0
          fi
          exit $rc
      - name: Upload session close artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbot-session-close-${{ github.run_id }}
          path: |
            data/raw/cbot_session_close.parquet
            reports/market/session_close_validation_*.md
          retention-days: 90
          if-no-files-found: warn
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: databento-bo-${{ github.run_id }}
          path: |
            data/raw/Databento/**
            data/raw/databento_bo_utc_historical.parquet
          retention-days: 90
          if-no-files-found: error

  # ── WBS 1.1.48: 관세청 GW 확장 수집 (대체·보완재 × 확대 원산지) ────────────────
  # 업로드본과 동일 포맷(연도시트×월행×5지표)으로 품목(HS)별·국가별 xlsx 생성 (A-073)
  # data.go.kr REST — 개발 샌드박스 프록시 차단이라 Actions에서만 수집 가능(A-069)
  customs-gw-extended:
    name: "1.1.48 | Korea Customs GW Extended (대체·보완재 HS × 원산지)"
    # A-184: _API 수집분을 main에 커밋 — 아티팩트 90일 만료 후에도 보존(재개 판정 근거)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # A-094: 6시간 강제 취소로 수집분 전량 유실 → 잡 상한을 240분으로 낮추고,
    # 스크립트 내부 예산(CUSTOMS_TIME_BUDGET_S)이 그보다 먼저 만료돼 저장 후 정상 종료하게 함.
    timeout-minutes: 240
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'customs-gw' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow openpyxl
      - name: Preflight — data.go.kr 연결 진단 (DNS·TCP·HTTP 분리)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        continue-on-error: true
        run: python scripts/diagnose_kr_hosts.py
      - name: Run Korea Customs GW extended ingest
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          HISTORICAL_START_YEAR:  ${{ github.event.inputs.start_year }}
          HISTORICAL_END_YEAR:    ${{ github.event.inputs.end_year }}
          # A-170: 3h→40min 단축 — data.go.kr 정상 시 GW 확장은 15~25분에 끝나고(A-094 병렬),
          #   야간 장애 시엔 3h 내내 ConnectTimeout만 누적하며 분석 체인 시작을 지연시켰다
          #   (7·8차 런 실증: 182분 대기 후 수집 0건). 장애면 빨리 실패하고 체인을 진행한다.
          CUSTOMS_TIME_BUDGET_S:  "2400"
        run: python scripts/ingest_customs_gw_xlsx.py
      - name: Commit API-collected GW files (A-184 — 90일 만료 대비 영속화)
        if: always()
        run: |
          if git diff --quiet -- "data/raw/관세청" 2>/dev/null; then
            echo "GW _API 수집분 변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "nexus-gw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/raw/관세청/**/*_API.xlsx" || true
          git diff --cached --quiet && { echo "스테이징 변경 없음"; exit 0; }
          git commit -m "data: 관세청 GW API 수집분 갱신 ($(date -u +%F)) [A-184]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload customs GW outputs
        uses: actions/upload-artifact@v4
        with:
          name: customs-gw-extended-${{ github.run_id }}
          path: |
            data/raw/customs_gw_historical.parquet
            data/raw/관세청/**/*.xlsx
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.43: USDA FAS GAIN 보고서 PDF 판독·요약 (Oilseeds + Biofuels) ──────
  # GAIN PDF를 판독해 연·월·국가별 요약(.md) + 메타/신호 parquet 생성.
  # 파일명 규칙 YY.MM_Country_Title.pdf. API 키 불필요. (A-058)
  gain-pdf-ingest:
    name: "1.1.43 | USDA FAS GAIN PDF Ingest (연·월·국가별 요약)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'gain-pdf' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber pandas pyarrow
      - name: Check for GAIN PDFs
        id: check_pdf
        run: |
          COUNT=$(find data/raw/USDA/FAS/GAIN -name "*.pdf" 2>/dev/null | wc -l)
          echo "pdf_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "GAIN PDF 파일 수: $COUNT"
      - name: Run GAIN PDF ingest
        if: steps.check_pdf.outputs.pdf_count != '0'
        run: python scripts/ingest_gain_pdf.py
      # Session 44: 요약 md 생성은 Unstructured Analysis Pipeline(unstructured_analysis.yml)로
      # 분리 — 본 잡은 G1 입력용 판독 parquet만 산출(정형·비정형 파이프라인 관심사 분리).
      - name: Upload GAIN metadata parquet
        if: steps.check_pdf.outputs.pdf_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gain-pdf-${{ github.run_id }}
          path: data/raw/gain_historical.parquet
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.1.42: USDA FAS 수동 업로드 Excel 수집 (WASDE · PSD · GATS) ──────────
  # main 브랜치에 수동 업로드된 Excel 파일을 Parquet으로 변환.
  # API 키 불필요. 파일이 없으면 각 단계가 자동 건너뜀.
  usda-manual-xlsx-ingest:
    name: "1.1.42 | USDA FAS Manual Excel Ingest (WASDE · PSD · GATS)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'usda-xlsx' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openpyxl pandas pyarrow

      - name: Check for WASDE Excel files
        id: check_wasde
        run: |
          COUNT=$(find data/raw/USDA/WASDE -name "*.xlsx" 2>/dev/null | wc -l)
          echo "xlsx_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "WASDE xlsx 파일 수: $COUNT"
      - name: Run WASDE Excel ingest
        if: steps.check_wasde.outputs.xlsx_count != '0'
        run: python scripts/ingest_wasde_xlsx.py
      - name: Upload WASDE output
        if: steps.check_wasde.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-wasde-xlsx-${{ github.run_id }}
          path: data/raw/wasde_historical.parquet
          retention-days: 90
          if-no-files-found: warn

      - name: Check for PSD Excel files
        id: check_psd
        run: |
          COUNT=$(find data/raw/USDA/FAS/PSD -name "*.xlsx" 2>/dev/null | wc -l)
          echo "xlsx_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "PSD xlsx 파일 수: $COUNT"
      - name: Run PSD Excel ingest
        if: steps.check_psd.outputs.xlsx_count != '0'
        run: python scripts/ingest_psd_data.py
      - name: Upload PSD output
        if: steps.check_psd.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-psd-xlsx-${{ github.run_id }}
          path: data/raw/psd_historical.parquet
          retention-days: 90
          if-no-files-found: warn

      - name: Check for GATS Excel files
        id: check_gats
        run: |
          COUNT=$(find data/raw/USDA/FAS/GATS -name "*.xlsx" 2>/dev/null | wc -l)
          echo "xlsx_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "GATS xlsx 파일 수: $COUNT"
      - name: Run GATS Excel ingest
        if: steps.check_gats.outputs.xlsx_count != '0'
        run: python scripts/ingest_gats_data.py
      - name: Upload GATS quantity output
        if: steps.check_gats.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gats-quantity-${{ github.run_id }}
          path: data/raw/gats_quantity_historical.parquet
          retention-days: 90
          if-no-files-found: warn
      - name: Upload GATS value output
        if: steps.check_gats.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gats-value-${{ github.run_id }}
          path: data/raw/gats_value_historical.parquet
          retention-days: 90
          if-no-files-found: warn

      # A-061: Trading Economics 9개년 히스토리(대체재·에너지·해운) 정형화
      - name: Check for Trading Economics Excel files
        id: check_te
        run: |
          COUNT=$(find "data/raw/Trading Economics" -name "*.xlsx" 2>/dev/null | wc -l)
          echo "xlsx_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "TE xlsx 파일 수: $COUNT"
      - name: Run Trading Economics Excel ingest
        if: steps.check_te.outputs.xlsx_count != '0'
        run: python scripts/ingest_te_xlsx.py
      - name: Upload Trading Economics output
        if: steps.check_te.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-te-commodities-${{ github.run_id }}
          path: data/raw/te_commodities_historical.parquet
          retention-days: 90
          if-no-files-found: warn

      # A-063: ICE 월별 거래량(U.S./E.U.) 정형화 (보조 변수)
      - name: Check for ICE Excel files
        id: check_ice
        run: |
          COUNT=$(find "data/raw/ICE" -name "*.xlsx" 2>/dev/null | wc -l)
          echo "xlsx_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "ICE xlsx 파일 수: $COUNT"
      - name: Run ICE volumes ingest
        if: steps.check_ice.outputs.xlsx_count != '0'
        run: python scripts/ingest_ice_volumes.py
      - name: Upload ICE output
        if: steps.check_ice.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-ice-volumes-${{ github.run_id }}
          path: data/raw/ice_monthly_volumes.parquet
          retention-days: 90
          if-no-files-found: warn

      # A-066: NASA POWER Agroclimatology 12개 산지 9개년 정형화
      - name: Check for NASA POWER Excel files
        id: check_nasa
        run: |
          COUNT=$(find "data/raw/NASA Power" -name "*.xlsx" 2>/dev/null | wc -l)
          echo "xlsx_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "NASA POWER xlsx 파일 수: $COUNT"
      - name: Run NASA POWER Excel ingest
        if: steps.check_nasa.outputs.xlsx_count != '0'
        run: python scripts/ingest_nasa_power_xlsx.py
      - name: Upload NASA POWER output
        if: steps.check_nasa.outputs.xlsx_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-nasa-power-${{ github.run_id }}
          path: data/raw/nasa_power_agroclimatology_historical.parquet
          retention-days: 90
          if-no-files-found: warn

      # A-064: 수집 parquet → xlsx 열람 사본 (historical/realtime 분리)
      - name: Export collected parquet to xlsx
        run: pip install openpyxl && python scripts/export_parquet_to_xlsx.py
      - name: Upload xlsx exports
        uses: actions/upload-artifact@v4
        with:
          name: backfill-xlsx-exports-${{ github.run_id }}
          path: data/raw/xlsx_exports/**
          retention-days: 90
          if-no-files-found: warn

  # ── WBS 1.4.1: GPR × SBO 상관관계 분석 (백필 완료 후 실행) ───────────────────
  gpr-sbo-correlation:
    name: "1.4.1 | GPR × SBO Correlation Analysis (Post-Backfill)"
    runs-on: ubuntu-latest
    needs:
      - economic-backfill
      - gpr-backfill
      - commodity-backfill
    if: ${{ always() && github.event.inputs.skip_analysis != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Run GPR × SBO correlation analysis
        run: python src/forecasting/gpr_sbo_correlation.py
      - name: Upload correlation report
        uses: actions/upload-artifact@v4
        with:
          name: backfill-gpr-sbo-correlation-${{ github.run_id }}
          path: reports/pipeline/gpr_sbo_correlation_*.html
          retention-days: 90

  # ── 백필 완료 요약 + Excel 내보내기 ──────────────────────────────────────────
  backfill-summary:
    name: "Backfill Summary Report + Excel Export"
    runs-on: ubuntu-latest
    needs:
      - economic-backfill
      - shipping-backfill
      - wasde-backfill
      - climate-backfill
      - gpr-backfill
      - production-backfill
      - commodity-backfill
      - customs-backfill
      - fao-amis-ingest
      - usda-manual-xlsx-ingest
      - gain-pdf-ingest
      - databento-bo
      - customs-gw-extended
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow openpyxl
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Generate backfill summary
        run: |
          python - <<'PYEOF'
          import os, glob
          from pathlib import Path
          import pandas as pd

          start_year = "${{ github.event.inputs.start_year }}"
          end_year   = "${{ github.event.inputs.end_year }}"

          files = glob.glob("data/raw/**/*.parquet", recursive=True) + glob.glob("data/raw/*.parquet")
          summary = []
          total_rows = 0
          for f in sorted(files):
              try:
                  df = pd.read_parquet(f)
                  rows = len(df)
                  total_rows += rows
                  date_col = next((c for c in ["price_date", "ingested_at"] if c in df.columns), None)
                  date_range = ""
                  if date_col:
                      mn = pd.to_datetime(df[date_col], errors="coerce").min()
                      mx = pd.to_datetime(df[date_col], errors="coerce").max()
                      date_range = f"{mn.date()} ~ {mx.date()}" if pd.notna(mn) else "N/A"
                  summary.append(f"| {Path(f).name} | {rows:,} | {date_range} | ✅ |")
              except Exception as e:
                  summary.append(f"| {Path(f).name} | – | – | ❌ {e} |")

          md = [
              f"## 과거 데이터 백필 완료 — {start_year}~{end_year}",
              f"**총 수집 레코드**: {total_rows:,}건  |  **기준 기간**: {start_year}~{end_year}",
              "",
              "| 파일 | 행 수 | 기간 | 상태 |",
              "|---|---|---|---|",
          ] + summary + [
              "",
              "### 다음 단계",
              "1. ✅ C-08 DQSOps 데이터 품질 검증 (아래 job)",
              "2. ✅ C-06 EDA 검증 — 이상치·결측치 프로파일",
              "3. ✅ G1 변수 중요도 분석 (5년 데이터 기반)",
          ]
          print("\n".join(md))
          gh_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if gh_summary:
              with open(gh_summary, "a") as fh:
                  fh.write("\n".join(md))
          PYEOF
      - name: Export parquet → Excel (다운로드용)
        run: python src/pipeline/export_data.py
      - name: Upload merged backfill dataset (Parquet + Excel)
        uses: actions/upload-artifact@v4
        with:
          name: backfill-all-${{ github.run_id }}
          path: |
            data/raw/*.parquet
            data/exports/*.xlsx
          retention-days: 90
          if-no-files-found: warn

  # ── C-08 DQSOps 데이터 품질 검증 (backfill-summary 후 1차 게이트) ───────────────
  # A-160: if에 상태함수가 없으면 GitHub이 암묵 success()를 전치 — 관세청 잡 1건
  #   실패로 분석 체인 4개 잡(C-08→C-06→Readiness→G1)이 전부 skip된 원인.
  #   always()로 커넥터 부분 실패와 분석 진행을 분리한다(필수 산출물은 DQ_EXPECTED가 관장).
  c08-dq-validation:
    name: "C-08 | DQSOps Data Quality Validation Gate"
    runs-on: ubuntu-latest
    needs: [backfill-summary]
    if: "!cancelled() && needs.backfill-summary.result == 'success' && github.event.inputs.skip_analysis != 'true'"
    outputs:
      overall_status: ${{ steps.dq.outputs.overall_status || steps.dq_skip.outputs.overall_status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Compute expected artifacts for this run
        id: expected
        run: |
          case "${{ github.event.inputs.connector }}" in
            all|"")     echo "expected=wasde_historical,psd_historical,gats_quantity_historical,te_commodities_historical,databento_bo_utc_historical" >> "$GITHUB_OUTPUT" ;;
            usda-xlsx)  echo "expected=wasde_historical,psd_historical,gats_quantity_historical" >> "$GITHUB_OUTPUT" ;;
            databento)  echo "expected=databento_bo_utc_historical" >> "$GITHUB_OUTPUT" ;;
            fao-amis)   echo "expected=fao_amis_historical" >> "$GITHUB_OUTPUT" ;;
            gain-pdf)   echo "expected=gain_historical" >> "$GITHUB_OUTPUT" ;;
            *)          echo "expected=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run C-08 DQSOps validation
        id: dq
        if: steps.expected.outputs.expected != ''
        env:
          DQ_EXPECTED: ${{ steps.expected.outputs.expected }}
        run: python src/pipeline/validators/c08_dq_validator.py
      - name: Mark gate skipped when the selected connector has no parquet output
        id: dq_skip
        if: steps.expected.outputs.expected == ''
        run: echo "overall_status=SKIPPED" >> "$GITHUB_OUTPUT"
      - name: Upload C-08 DQ report
        uses: actions/upload-artifact@v4
        with:
          name: c08-dq-report-backfill-${{ github.run_id }}
          path: reports/data_quality/dq_report_*.json
          retention-days: 90
          if-no-files-found: warn

  # ── C-06 EDA 검증 (C-08 DQ 통과 후 2차 게이트) ──────────────────────────────
  c06-eda-validation:
    name: "C-06 | EDA Validation — Data Integrity Gate"
    runs-on: ubuntu-latest
    needs: [c08-dq-validation]
    # A-166: 구 조건(overall == 'PASS')은 C-08 WARNING(보조 지표 경고일 뿐, 필수 5종
    #   전부 PASS·종합 0.8905)에도 체인을 전멸시켰다(런 31758600044 — G1 미산출).
    #   WARNING은 진행하되 리포트에 표기, REJECTED만 차단한다.
    # A-168: 상태 함수 부재 시 GitHub이 암묵 success()를 전치 — 전이 needs 체인에
    #   cancelled/failure 잡(관세청 2종)이 있으면 C-08 성공에도 skip됨(런 31812867920
    #   재발, A-160 동일 유형). always() 명시로 차단.
    if: >-
      !cancelled() &&
      github.event.inputs.skip_analysis != 'true' &&
      needs.c08-dq-validation.result == 'success' &&
      (needs.c08-dq-validation.outputs.overall_status == 'PASS' ||
       needs.c08-dq-validation.outputs.overall_status == 'WARNING')
    outputs:
      eda_status: ${{ steps.eda.outputs.eda_status }}
      stale_connectors: ${{ steps.eda.outputs.stale_connectors }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow numpy scipy
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Run C-06 EDA validation
        id: eda
        run: |
          python - <<'PYEOF'
          import os, glob, json
          from pathlib import Path
          from datetime import date, timedelta
          import numpy as np
          import pandas as pd

          OUTPUT_DIR = "reports/pipeline"
          os.makedirs(OUTPUT_DIR, exist_ok=True)
          today = date.today()
          # 백필 데이터: 과거 데이터이므로 신선도 기준을 수집 시각(ingested_at) 기준으로 적용
          stale_threshold = 1  # ingested_at 기준 1일 이내면 신선 (백필 직후)

          results = {}
          stale = []
          for f in sorted(glob.glob("data/raw/**/*.parquet", recursive=True)
                          + glob.glob("data/raw/*.parquet")):
              name = Path(f).stem
              try:
                  df = pd.read_parquet(f)
              except Exception as e:
                  results[name] = {"status": "READ_ERROR", "error": str(e)}
                  continue
              null_pct = float(df.isnull().mean().mean() * 100)
              freshness = "OK"
              if "ingested_at" in df.columns:
                  max_ts = pd.to_datetime(df["ingested_at"], utc=True, errors="coerce").max()
                  if pd.notna(max_ts):
                      hours_since = (pd.Timestamp.utcnow() - max_ts).total_seconds() / 3600
                      if hours_since > 24:
                          freshness = f"STALE_{int(hours_since)}h"
                          stale.append(name)
              # 날짜 범위 확인 (과거 데이터가 제대로 수집됐는지)
              price_date_range = {}
              if "price_date" in df.columns:
                  dates = pd.to_datetime(df["price_date"], errors="coerce").dropna()
                  if not dates.empty:
                      price_date_range = {"min": str(dates.min().date()), "max": str(dates.max().date()), "unique_dates": int(dates.nunique())}
              num_cols = df.select_dtypes(include="number").columns.tolist()
              outlier_flags = {}
              for col in num_cols[:10]:
                  vals = pd.to_numeric(df[col], errors="coerce").dropna()
                  if len(vals) > 5:
                      z = (vals - vals.mean()) / vals.std()
                      outlier_count = int((z.abs() > 3).sum())
                      if outlier_count:
                          outlier_flags[col] = outlier_count
              results[name] = {
                  "status": "STALE" if "STALE" in freshness else ("WARN" if null_pct > 5 else "OK"),
                  "rows": len(df), "null_pct": round(null_pct, 1),
                  "freshness": freshness,
                  "price_date_range": price_date_range,
                  "outlier_cols": outlier_flags,
              }
              if null_pct > 5:
                  print(f"[C-06 경고] {name}: 결측치 {null_pct:.1f}%")
              if outlier_flags:
                  print(f"[C-06 경고] {name}: Z>3 이상치: {outlier_flags}")
              if price_date_range:
                  dates_cnt = price_date_range.get('unique_dates', 0)
                  print(f"[C-06 정보] {name}: {price_date_range.get('min')} ~ {price_date_range.get('max')} ({dates_cnt}개 날짜)")

          report = {"run_date": today.isoformat(), "mode": "BACKFILL", "connectors": results,
                    "stale": stale, "overall": "PASS" if not stale else "WARN"}
          out = f"{OUTPUT_DIR}/c06_eda_report_{today.strftime('%Y%m%d')}_backfill.json"
          with open(out, "w") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
          print(f"[C-06 완료] EDA 검증 보고서 → {out}")
          gh_output = os.environ.get("GITHUB_OUTPUT", "")
          if gh_output:
              with open(gh_output, "a") as fh:
                  fh.write(f"eda_status={'WARN' if stale else 'PASS'}\n")
                  fh.write(f"stale_connectors={','.join(stale) or 'none'}\n")
          PYEOF
      - name: Upload C-06 EDA report
        uses: actions/upload-artifact@v4
        with:
          name: c06-eda-report-backfill-${{ github.run_id }}
          path: reports/pipeline/c06_eda_report_*_backfill.json
          retention-days: 90
          if-no-files-found: warn

  # ── 모델 진입 준비도 게이트: 목표가격 계약·핵심피처·as-of ───────────────────
  model-readiness:
    name: "Model Readiness | Target Contract & Core Features"
    runs-on: ubuntu-latest
    needs: [c06-eda-validation]
    if: >-
      !cancelled() &&
      github.event.inputs.skip_analysis != 'true' &&
      needs.c06-eda-validation.result == 'success' &&
      needs.c06-eda-validation.outputs.eda_status == 'PASS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow duckdb pyyaml
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Run model readiness gate
        run: python scripts/data_readiness.py
      - name: Build and independently verify feature mart
        # A-171: 'python src/...' 직접 실행은 repo 루트가 sys.path에 없어
        #   `from src.pipeline.asof import ...`가 ModuleNotFoundError(9차 런 실증) — -m 실행
        run: |
          python -m src.features.build_feature_mart --self-test
          python -m src.features.build_feature_mart
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-readiness-backfill-${{ github.run_id }}
          path: |
            reports/market/data_readiness_*.md
            reports/market/feature_mart_*.md
            data/gold/feature_mart.parquet
            data/gold/feature_contract.yaml
          retention-days: 90
          if-no-files-found: error

  # ── G1 변수 중요도 분석 (5년 히스토리 기반 — 준비도 게이트 통과 후) ────────────
  # 5년 데이터를 사용하므로 days=1825 (5년치 parquet 전체 로드)
  g1-analysis:
    name: "C-03 | G1 Variable Importance Analysis (5-Year Backfill Dataset)"
    runs-on: ubuntu-latest
    needs: [model-readiness]
    if: "!cancelled() && needs.model-readiness.result == 'success'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0 2>/dev/null || true
          pip install pandas pyarrow pyyaml scikit-learn statsmodels numpy weasyprint markdown2
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Restore feature mart to data/gold (A-178 — merge 다운로드 착지 보정)
        # Readiness 잡이 만든 mart(gold)는 아티팩트 내부 경로가 data/gold/*라서
        # merge 다운로드 시 data/raw/data/gold/에 착지 — G1 로더 기대 경로로 복원.
        # (15차 런 실증: 모든 게이트 통과 후 mart 미발견으로만 실패)
        run: |
          mkdir -p data/gold
          for f in feature_mart.parquet feature_contract.yaml; do
            src=$(find data/raw -name "$f" -type f | head -n 1)
            if [ -n "$src" ]; then mv "$src" "data/gold/$f"; echo "복원: $f ($src)"; fi
          done
          test -f data/gold/feature_mart.parquet || { echo "::error::feature mart 미착지 — readiness 아티팩트 확인"; exit 1; }
      - name: as-of 시점 정합성 게이트 (D-023) — 위반 시 모델 진입 차단
        # available_at 없는 피처는 CLAUDE.md §1에 따라 모델 투입 금지.
        # 이행기에는 ASOF_EXEMPT로 미적용 산출물을 면제할 수 있다(적용 완료 시 제거).
        env:
          ASOF_EXEMPT: ${{ vars.ASOF_EXEMPT }}
        run: python scripts/validate_asof.py

      - name: Rebuild unstructured signal time series (통합 분석 입력 — Session 44)
        # 커밋된 비정형 인덱스 CSV(unstructured_index_*.csv)에서 UNSTR_* 월별 태그·톤
        # parquet을 재생성 → G1이 정형+비정형 통합 분석 (parquet은 .gitignore라 커밋 불가)
        run: python scripts/build_unstructured_timeseries.py
      - name: Run C-03 G1 variable importance analysis (5-year window)
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python src/forecasting/variable_importance_g1.py 1825
      - name: Publish G1 TOP 10 to Step Summary (A-179 — 조정자 즉시 열람)
        run: |
          latest=$(ls -t reports/pipeline/g1_variable_importance_*_ko.md 2>/dev/null | head -n 1)
          if [ -n "$latest" ]; then
            cat "$latest" | tee -a "$GITHUB_STEP_SUMMARY"   # A-180: 로그에도 남겨 원격 취합 가능
          else
            echo "::warning::G1 ko.md 미발견 — Step Summary 노출 생략"
          fi
      - name: GPT 교차검증 (조정자 지시 2026-08-13 — 분석 산출물 외부 모델 검증)
        # 실패해도 파이프라인을 막지 않는다 — 외부 서비스 장애가 우리 장애가 되지 않게.
        # 검증 결과는 아티팩트로 남겨 사람이 리포트와 대조한다.
        continue-on-error: true
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GPT_XVERIFY_MODEL:  ${{ vars.GPT_XVERIFY_MODEL || 'gpt-5.6-sol' }}
          GPT_XVERIFY_EFFORT: "xhigh"   # A-166: gpt-5.6-sol은 max 미지원(400) — 지원 최대치 xhigh
        run: |
          pip install openai
          python scripts/cross_verify_gpt.py "reports/pipeline/variable_importance_*.md" "reports/market/feature_mart_*.md"
      - name: Upload cross-verify report
        uses: actions/upload-artifact@v4
        with:
          name: gpt-xverify-${{ github.run_id }}
          path: reports/cross_verify/
          retention-days: 90
          if-no-files-found: warn
      # NOTE(A-056): generate_research_pdf.py 를 reports/pipeline 에 돌리던 단계 제거.
      # 해당 스크립트는 g1_*_ko.md(구형 "TOP 10" 요약)를 ko.html/ko.pdf 로 재렌더링해
      # variable_importance_g1.py 가 만든 '상위 5개 핵심 변수' 리치 KO 리포트를 덮어썼음.
      # (EN 은 _en.md 가 없어 덮이지 않아 영어만 정상 → "한국어만 깨짐" 증상의 진짜 원인)
      # variable_importance_g1.py 가 ko/en HTML+PDF 를 모두 생성하므로 이 단계는 불필요.
      - name: Append G1 summary to Step Summary
        run: |
          python - <<'PYEOF'
          import os, glob
          from pathlib import Path
          reports = sorted(glob.glob("reports/pipeline/g1_variable_importance_*_ko.html"))
          if reports:
              latest = Path(reports[-1]).name
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"\n\n## C-03 G1 분석 완료 (5년 백필 기반)\n리포트: `{latest}`\n")
                  f.write("\n**HITL 게이트**: G1 분석은 데이터 이해 목적. 조달 결정은 CLAUDE.md §6 HITL 프로세스 필요.\n")
          PYEOF
      - name: Upload G1 analysis reports (HTML + PDF)
        uses: actions/upload-artifact@v4
        with:
          name: g1-backfill-report-${{ github.run_id }}
          path: |
            reports/pipeline/g1_daily_brief_*.html
            reports/pipeline/g1_variable_importance_*.html
            reports/pipeline/g1_variable_importance_*.pdf
          retention-days: 90
          if-no-files-found: error
