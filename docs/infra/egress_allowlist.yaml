    paid: true
  - host: api.perplexity.ai
    port: 443
    purpose: 실시간 프록시(BCAA · GPR · 정책 뉴스)
    criticality: medium
    paid: true

  # ── 빌드·런타임 (파이프라인 실행 전제) ───────────────────────────────────
  - host: pypi.org
    port: 443
    purpose: Python 패키지 설치
    criticality: critical
  - host: files.pythonhosted.org
    port: 443
