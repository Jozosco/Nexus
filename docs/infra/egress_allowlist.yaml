# docs/infra/egress_allowlist.yaml — 아웃바운드 방화벽 허용 목록 (임계경로)
#
# 목적: 11월 Control Tower AWS 통합 시 Nexus 파이프라인이 호출하는 **모든 외부 호스트**를
#       사전에 방화벽 allowlist로 신청하기 위한 단일 진실원천.
#
# ⚠️ 왜 임계경로인가 — 이미 실증된 선례가 있다:
#   A-069  apis.data.go.kr  → CONNECT 403 (개발 샌드박스 프록시 차단)
#   A-070  kosis.kr         → 동일
#   A-071  query1/2.finance.yahoo.com → 사내 IP 방화벽 승인 필요 사례
#   2026-08-12 archive-api.open-meteo.com → 동일하게 403
#   즉 **미신청 호스트는 통합 즉시 전면 차단**되며, 승인 리드타임은 우리가 통제할 수 없다.
#
# 유지 규칙: 새 커넥터를 추가하는 PR은 이 파일 갱신을 **필수 조건**으로 한다(C-05 체크 항목).
#           호스트가 이관되면(A-138 GPR 사례) 폴백이 아닌 **1순위 호스트**를 반드시 등재한다.
#
# 추출 근거: src/pipeline/connectors/ · scripts/ · src/forecasting/ · src/utils/ ·
#           .github/workflows/ 전수 grep + 코드 대조 검증(2026-08-20)
#
# ── 2026-08-20 재배열 (조정자 지시) ──────────────────────────────────────────
#   구조 변경: 데이터 도메인별 → **신청 실행 순서**(제출 요약 → 예외 승인 → 중요도 티어).
#   검증으로 바로잡은 것 3건:
#     ① summary.total 오기 — 34로 표기됐으나 실제 항목은 37개였음(신청서 수량 불일치 위험)
#     ② **www.matteoiacoviello.com 누락** — A-138 이관 후 GPR 1순위 호스트인데 목록에
#        폴백(policyuncertainty.com)만 있었음. 미신청 시 G1 핵심 변수 GPR 전면 차단
#     ③ apis.datos.gob.ar 누락 — INDEC 아르헨 생산통계
#   각 항목에 `impact_if_blocked`(차단 시 영향) 추가 — 방화벽 심사자가 필요성을 판단하는 근거.
version: '2.2'                   # v2.2: 전문 매체 RSS 2종 추가(조정자 지시 8/25 — 일별 수집원)
updated: 2026-08-25
owner: C-04
submission_deadline: 2026-08-29   # 조정자 제출 목표(11월 통합 시 수집 중단 방지)

# ════════════════════════════════════════════════════════════════════════════
# §1 제출 요약 — 신청서 상단에 그대로 기재
# ════════════════════════════════════════════════════════════════════════════
submission:
  total_requested: 42          # 신청 대상 호스트 수 (제외 1건 미포함) — v2.2: 전문 매체 RSS 2종 추가(8/25)
  by_criticality:
    critical: 6                # 차단 시 파이프라인·모델 전면 중단
    high: 9                    # 차단 시 핵심 변수 결손
    medium: 13                 # 차단 시 보조 신호 결손(대체 경로 존재) — v2.2: RSS 2종 추가
    low: 14                    # 폴백·부가 기능
  exceptions_requiring_approval: 3   # §2 참조 (평문 HTTP 1 · WebSocket 1 · 조건부 신규 1)
  excluded: 1                  # cds.climate.copernicus.eu — 미사용 확정, 신청 불요
  protocol_note: >
    42건 중 40건은 표준 443/TLS. 예외 2건은 §2에 분리 기재했다.
    프로토콜·포트가 표준과 다른 항목만 별도 승인이 필요하며, 나머지는 일괄 처리 가능하다.

# ════════════════════════════════════════════════════════════════════════════
# §2 예외 승인 필요 — 표준 정책으로 통과하지 않는 항목 (먼저 협의)
# ════════════════════════════════════════════════════════════════════════════
exceptions:
  - host: apis.data.go.kr
    issue: 평문 HTTP 80
    detail: >
      관세청 공공데이터포털 API가 HTTP만 제공한다. HTTPS 전용 정책이면 **포트 80 예외 승인**
      또는 사내 프록시 경유 HTTPS 종단 방식 확인이 필요하다.
    if_denied: 관세청 수출입실적(대두유 + 대체·보완재 16 HS × 10개국) 수집 불가 — 도착가 실측 기반 소멸
  - host: stream.aisstream.io
    issue: WebSocket(wss) — HTTP 프록시로 통과 불가
    detail: >
      AISstream은 REST가 없고 wss 전용이다(A-042). HTTP 프록시만 허용하는 정책에서는
      연결 자체가 불가하므로 **WebSocket 예외** 또는 별도 아웃바운드 경로가 필요하다.
    if_denied: 해협 탱커 추적 상실 — Perplexity 프록시로 대체(정밀도 저하, 치명 아님)
  - host: "{storage-account}.blob.core.windows.net + login.microsoftonline.com"
    issue: 조건부 신규 — 9월 Azure Blob 이관 시 필요(D-028)
    detail: >
      아직 미신청 상태다. 이관 경로가 확정되면 **2건을 추가 신청**해야 한다.
      계정명이 정해지지 않아 와일드카드(`*.blob.core.windows.net`) 신청 가능 여부 확인 필요.
    if_denied: 9월 모델 스냅샷 이관 불가 — Actions 종료(11월) 후 실행 표면 상실

