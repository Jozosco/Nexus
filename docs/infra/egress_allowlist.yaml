# docs/infra/egress_allowlist.yaml — 아웃바운드 방화벽 허용 목록 (임계경로)
#
# 목적: 11월 Control Tower AWS 통합 시 Nexus 파이프라인이 호출하는 **모든 외부 호스트**를
#       사전에 방화벽 allowlist로 신청하기 위한 단일 진실원천.
#
# ⚠️ 왜 임계경로인가 — 이미 실증된 선례가 있다:
#   A-069  apis.data.go.kr  → CONNECT 403 (개발 샌드박스 프록시 차단)
#   A-070  kosis.kr         → 동일
#   A-071  query1/2.finance.yahoo.com → 사내 IP 방화벽 승인 필요 사례
#   2026-08-12 archive-api.open-meteo.com → 동일하게 403
#   즉 **미신청 호스트는 통합 즉시 전면 차단**되며, 승인 리드타임은 우리가 통제할 수 없다.
#
# 유지 규칙: 새 커넥터를 추가하는 PR은 이 파일 갱신을 **필수 조건**으로 한다(C-05 체크 항목).
#
# 추출 근거: src/pipeline/connectors/ · scripts/ · src/forecasting/ · .github/workflows/ 전수 grep
version: '1.0'
updated: 2026-08-12
owner: C-04
submission_deadline: 2026-08-29   # 조정자 제출 목표(9~10월 수집 중단 방지)

# 프로토콜 주의: 대부분 443/TLS이나 관세청은 **평문 80**을 사용한다(http://apis.data.go.kr).
# HTTPS 전용 정책이면 관세청 예외 승인 또는 https 전환 가능 여부 확인 필요.

hosts:
  # ── 시장·가격 (유료 포함) ────────────────────────────────────────────────
  - host: hist.databento.com
    port: 443
    purpose: CBOT 대두유 선물(ZL) 15개년 — G2 타깃 시계열
    connector: scripts/ingest_databento_bo.py (databento SDK)
    criticality: critical      # 목표변수. 차단 시 G2 전면 중단
    paid: true
  - host: api.tradingeconomics.com
    port: 443
    purpose: BDI · CPO
    connector: te_connector.py · shipping_connector.py
    criticality: high
    paid: true
  - host: stooq.com
    port: 443
    purpose: BDI 폴백(CSV)
    connector: shipping_connector.py
    criticality: medium
  - host: query1.finance.yahoo.com
    port: 443
    purpose: yfinance BO=F 폴백
    connector: commodity_connector.py
    criticality: low           # Databento가 1순위
  - host: query2.finance.yahoo.com
    port: 443
    purpose: 동일(yfinance 이중화)
    criticality: low
  - host: data.nasdaq.com
    port: 443
    purpose: 레거시 조회(B-003으로 용도 축소)
    criticality: low

  # ── 거시·금융 ────────────────────────────────────────────────────────────
  - host: api.stlouisfed.org
    port: 443
    purpose: FRED — FX·금리·CPI·VIX·CPO 프록시
    connector: economic_connector.py
    criticality: critical
  - host: api.eia.gov
    port: 443
    purpose: Brent 원유
    connector: economic_connector.py
    criticality: high
  - host: ecos.bok.or.kr
    port: 443
    purpose: 한국은행 ECOS — 금리·환율
    connector: economic_connector.py
    criticality: medium        # FRED DEXKOUS로 대체 가능(A-104)
    note: 한국 호스트 — 간헐 ConnectTimeout 이력(A-095/A-104)
  - host: kosis.kr
    port: 443
    purpose: 한국 CPI
    connector: economic_connector.py
    criticality: medium
    note: 한국 호스트 · 샌드박스 차단 이력(A-070)
  - host: api.bcra.gob.ar
    port: 443
    purpose: 아르헨티나 ARS 환율
    connector: commodity_connector.py
    criticality: medium

  # ── 무역·관세 ────────────────────────────────────────────────────────────
  - host: apis.data.go.kr
    port: 80                    # ⚠️ 평문 HTTP — HTTPS 전용 정책 시 예외 승인 필요
    purpose: 관세청 GW 수출입실적(대두유 + 대체·보완재 9품목 × 10개국)
    connector: customs_connector.py · scripts/ingest_customs_gw_xlsx.py
    criticality: critical
    note: 샌드박스 CONNECT 403 실증(A-069) — Actions 전용 실행 중
  - host: comtradeapi.un.org
    port: 443
    purpose: UN Comtrade 폴백
    connector: customs_connector.py (comtradeapicall)
    criticality: low

  # ── 수급·작황 (USDA) ─────────────────────────────────────────────────────
  - host: api.fas.usda.gov
    port: 443
    purpose: FAS PSD · ESR (신규 호스트 — 1순위)
    connector: wasde_connector.py · production_connector.py
    criticality: high
  - host: apps.fas.usda.gov
    port: 443
    purpose: 구 OpenData 호스트(폴백)
    criticality: low
    note: 500 지속 중(A-098) — 이관 확인 후 제거 검토
  - host: quickstats.nass.usda.gov
    port: 443
    purpose: NASS 대두 생산·수확
    connector: production_connector.py
    criticality: high
  - host: api.ers.usda.gov
    port: 443
    purpose: ERS ARMS 생산비용(보조 지표)
    criticality: low
  - host: data.ers.usda.gov
    port: 443
    purpose: ARMS 구 호스트(폴백)
    criticality: low
  - host: fenixservices.fao.org
    port: 443
    purpose: FAOSTAT 생산·교역
    connector: production_connector.py
    criticality: medium

  # ── 기후·기상 ────────────────────────────────────────────────────────────
  - host: archive-api.open-meteo.com
    port: 443
    purpose: ERA5-Land 12개 생산지역 일별 기후(daily + hourly 토양)
    connector: climate_connector.py
    criticality: critical
    note: 2026-08-12 샌드박스 403 실증 — 키 불요이나 방화벽 허용 필수
  - host: www.cpc.ncep.noaa.gov
    port: 443
    purpose: NOAA CPC ENSO ONI
    connector: climate_connector.py
    criticality: high
  - host: power.larc.nasa.gov
    port: 443
    purpose: NASA POWER 농업기상(6지역)
    connector: production_connector.py
    criticality: high
  - host: usdmdataservices.unl.edu
    port: 443
    purpose: US Drought Monitor
    connector: commodity_connector.py
    criticality: medium
  - host: api.weather.gov
    port: 443
    purpose: NOAA 기상경보(중서부 생산 주)
    connector: geointel_connector.py
    criticality: medium
  - host: api.openweathermap.org
    port: 443
    purpose: 현재 기상(레거시 3개 원산지)
    criticality: low
  - host: cds.climate.copernicus.eu
